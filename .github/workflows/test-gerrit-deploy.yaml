---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Test Gerrit server connectivity workflow
name: "Test Deploy Gerrit 🔗"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug output"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      sync_on_startup:
        description: "Trigger replication after startup"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      persist_project_slugs:
        # Supports: 'none', 'all', single value, comma/space-separated,
        # wildcards (*,?). Use 'none' to disable persistent sessions.
        description: "Persistent session selector (project slug)"
        required: false
        default: "onap"
        type: string
      persist_minutes:
        description: "Persistent session duration (minutes, 0 to skip, max 600)"
        required: false
        default: 15
        type: number
      match_api_path:
        # e.g., /r, /infra
        description: "Match origin server API URL/path"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      remote_access:
        # Makes Gerrit instance accessible from outside GitHub
        description: "Enable remote Gerrit access"
        required: false
        default: "None"
        type: choice
        options:
          - "None"
          - "Bore"
          - "Tailscale"
      reset_orgs:
        description: "Reset (delete all repos from) GitHub ORGs"
        required: false
        default: false
        type: boolean
      sync_orgs:
        description: "Sync GitHub ORGs from Gerrit"
        required: false
        default: false
        type: boolean
      sync_project_slugs:
        # Supports: 'all', single value, comma/space-separated, wildcards (*,?)
        description: "GitHub orgs to reset/sync (selector)"
        required: false
        default: "all"
        type: string
      gerrit_clone_ref:
        # e.g. modeseven-lfreleng-actions/gerrit-clone-action@fix-github-bugs
        # When unset, defaults to installing/running from PyPI with 'uvx'
        description: "Build gerrit-clone from git ref"
        required: false
        # yamllint disable-line rule:line-length
        default: "modeseven-lfreleng-actions/gerrit-clone-action@feat/content-filtering"
        type: string
      gerrit_action_ref:
        # e.g. modeseven-lfreleng-actions/gerrit-action@fix/docker-pep668
        # Format: owner/repo@branch (checked out and used locally)
        # When unset, defaults to upstream main branch
        description: "Use gerrit-action from git ref"
        required: false
        # yamllint disable-line rule:line-length
        # default: "lfreleng-actions/gerrit-action@main"
        default: "modeseven-lfreleng-actions/gerrit-action@integration-updates"
        type: string
      configure_g2p:
        # Configures gerrit_to_platform inside the deployed Gerrit
        # container. Only effective when persistent sessions are
        # active (selector is not 'none'). The target GitHub org
        # is derived from the server slug: modeseven-gerrit-<slug>
        description: "Configure Gerrit to Platform (g2p)"
        required: false
        default: false
        type: boolean
      g2p_org_setup:
        description: "G2P org setup mode"
        required: false
        type: choice
        options:
          - provision
          - verify
          - skip
        default: 'provision'
      remove_files:
        description: >-
          File patterns to remove from cloned repos
          before pushing (e.g. '.github/**')
        required: false
        default: ".github/**"
        type: string
      git_filter_projects:
        description: >-
          Project patterns for git history token replacement
          (semicolon-separated, tokens from GIT_FILTER_TOKENS)
        required: false
        default: "testsuite/pythonsdk-tests"
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Validate inputs ###
  validate:
    name: "Validate inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      persist_minutes: ${{ steps.validate.outputs.persist_minutes }}
      effective_debug: ${{ steps.validate.outputs.effective_debug }}
    steps:
      - name: "Validate persist_minutes"
        id: validate
        env:
          PERSIST_MINUTES: ${{ inputs.persist_minutes || 15 }}
          DEBUG_INPUT: ${{ inputs.debug || 'false' }}
          # RUNNER_DEBUG is set to '1' when re-running with debug logging
          RUNNER_DEBUG: ${{ runner.debug }}
          # ACTIONS_STEP_DEBUG is 'true' when step debug logging is enabled
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
        run: |
          # Validate persist_minutes input
          if ! [[ "$PERSIST_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::persist_minutes must be an integer: $PERSIST_MINUTES"
            exit 1
          fi
          if [ "$PERSIST_MINUTES" -gt 600 ]; then
            echo "::warning::persist_minutes capped" \
              "at 600 (was: $PERSIST_MINUTES)"
            PERSIST_MINUTES=600
          fi
          echo "persist_minutes=$PERSIST_MINUTES" >> "$GITHUB_OUTPUT"
          echo "Validated persist_minutes: $PERSIST_MINUTES"

          # Compute effective debug: true if input OR runner debug is enabled
          # GitHub sets RUNNER_DEBUG=1 and/or ACTIONS_STEP_DEBUG=true when
          # re-running with debug logging enabled
          if [ "$DEBUG_INPUT" = "true" ] || [ "$RUNNER_DEBUG" = "1" ] || \
             [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
            EFFECTIVE_DEBUG="true"
            if [ "$RUNNER_DEBUG" = "1" ] || \
               [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
              echo "Debug enabled via GitHub 'Re-run with debug logging'"
              echo "  RUNNER_DEBUG=$RUNNER_DEBUG"
              echo "  ACTIONS_STEP_DEBUG=$ACTIONS_STEP_DEBUG"
            else
              echo "Debug enabled via workflow input"
            fi
          else
            EFFECTIVE_DEBUG="false"
          fi
          echo "effective_debug=$EFFECTIVE_DEBUG" >> "$GITHUB_OUTPUT"
          echo "Effective debug: $EFFECTIVE_DEBUG"

  ### Extract non-sensitive matrix data ###
  prepare:
    name: "Prepare Gerrit matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      debug_matrix: ${{ steps.set-matrix.outputs.debug_matrix }}
      debug_count: ${{ steps.set-matrix.outputs.debug_count }}
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d  # v2.16.1
        with:
          egress-policy: audit

      - name: "Set matrix from repository variable"
        id: set-matrix
        env:
          # GERRIT_SERVERS is a repository variable (not secret) containing:
          # [{"project":"ONAP","slug":"onap","gerrit":"gerrit.onap.org",...}]
          GERRIT_SERVERS: ${{ vars.GERRIT_SERVERS }}
          PERSIST_PROJECT_SLUGS: ${{ inputs.persist_project_slugs }}
        run: |
          # Set matrix from GERRIT_SERVERS repository variable
          if [ -z "$GERRIT_SERVERS" ]; then
            echo "::error::GERRIT_SERVERS variable is not set"
            exit 1
          fi

          # Validate JSON format
          if ! echo "$GERRIT_SERVERS" | jq empty 2>/dev/null; then
            echo "::error::GERRIT_SERVERS is not valid JSON"
            exit 1
          fi

          COUNT=$(echo "$GERRIT_SERVERS" | jq '. | length')
          echo "Full server list: $COUNT Gerrit servers"

          # Output filtered matrix for persist/debug tests
          # "none" (case-insensitive) disables persistent sessions entirely
          SLUGS_LOWER=$(echo "$PERSIST_PROJECT_SLUGS" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ "$SLUGS_LOWER" = "none" ]; then
            # Explicitly disabled — output empty matrix, no error
            DEBUG_MATRIX="[]"
            echo "Persistent sessions disabled (selector: none)"
          elif [ -z "$PERSIST_PROJECT_SLUGS" ] || \
               [ "$PERSIST_PROJECT_SLUGS" = "all" ]; then
            # Empty selector or "all" = all servers
            DEBUG_MATRIX="$MATRIX"
            echo "Debug matrix: all $COUNT servers (no selector)"
          else
            # Parse comma/space-separated selectors and support wildcards
            # Convert to newline-separated, trim whitespace
            SELECTORS=$(echo "$PERSIST_PROJECT_SLUGS" \
              | tr ',' '\n' | tr ' ' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -v '^$')

            echo "Selectors to match:"
            echo "$SELECTORS"

            # Build jq filter for each selector (wildcards supported)
            # Convert shell wildcards to regex: * -> .*, ? -> .
            DEBUG_MATRIX=$(echo "$GERRIT_SERVERS" | \
              jq -c --arg selectors "$SELECTORS" '
              ($selectors | split("\n")) as $sels |
              [.[] | . as $server |
                select(
                  any($sels[]; . as $sel |
                    if ($sel | contains("*")) or ($sel | contains("?")) then
                      # Convert glob to regex: * -> .*, ? -> .
                      ($sel | gsub("\\*"; ".*") | gsub("\\?"; ".")) as $regex |
                      ($server.slug | test("^" + $regex + "$"))
                    else
                      $server.slug == $sel
                    end
                  )
                )
              ]
            ')
            DEBUG_COUNT=$(echo "$DEBUG_MATRIX" | jq '. | length')
            if [ "$DEBUG_COUNT" -eq 0 ]; then
              echo "::error::No servers matched" \
                "selector: $PERSIST_PROJECT_SLUGS"
              echo "Available slugs:"
              echo "$GERRIT_SERVERS" | jq -r '.[].slug'
              exit 1
            fi
            echo "Debug matrix: $DEBUG_COUNT server(s) [$PERSIST_PROJECT_SLUGS]"
          fi
          echo "debug_matrix=$DEBUG_MATRIX" >> "$GITHUB_OUTPUT"
          DEBUG_COUNT=$(echo "$DEBUG_MATRIX" | jq '. | length')
          echo "debug_count=$DEBUG_COUNT" >> "$GITHUB_OUTPUT"

  ### Gerrit Deployment with Optional Tunnel Access ###
  deploy-gerrit:
    name: "Deploy: ${{ matrix.server.name }}"
    runs-on: ubuntu-latest
    needs: [validate, prepare]
    if: >-
      needs.validate.outputs.persist_minutes != '0'
      && needs.prepare.outputs.debug_count != '0'
    permissions:
      contents: read
    timeout-minutes: 605
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.debug_matrix) }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d  # v2.16.1
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: "Parse gerrit-action ref"
        id: gerrit-action-ref
        env:
          # yamllint disable-line rule:line-length
          ACTION_REF: ${{ inputs.gerrit_action_ref || 'lfreleng-actions/gerrit-action@main' }}
        run: |
          # Parse owner/repo@branch format
          REPO="${ACTION_REF%%@*}"
          BRANCH="${ACTION_REF#*@}"
          if [ "$BRANCH" = "$ACTION_REF" ]; then
            BRANCH="main"
          fi
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Using gerrit-action: $REPO @ $BRANCH"

      - name: "Checkout gerrit-action"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ steps.gerrit-action-ref.outputs.repository }}
          ref: ${{ steps.gerrit-action-ref.outputs.ref }}
          path: .gerrit-action

      - name: "Lookup credentials for ${{ matrix.server.slug }}"
        id: credentials
        env:
          GERRIT_CREDENTIALS_B64: ${{ secrets.GERRIT_CREDENTIALS }}
          SERVER_SLUG: ${{ matrix.server.slug }}
        run: |
          # Lookup credentials for this server from the base64-encoded secret
          if [ -z "$GERRIT_CREDENTIALS_B64" ]; then
            echo "::error::GERRIT_CREDENTIALS secret is not set"
            exit 1
          fi

          GERRIT_CREDENTIALS=$(echo "$GERRIT_CREDENTIALS_B64" \
            | base64 -d 2>/dev/null)
          if [ -z "$GERRIT_CREDENTIALS" ]; then
            echo "::error::Failed to decode GERRIT_CREDENTIALS (invalid base64)"
            exit 1
          fi

          if ! echo "$GERRIT_CREDENTIALS" | jq empty 2>/dev/null; then
            echo "::error::Decoded GERRIT_CREDENTIALS is not valid JSON"
            exit 1
          fi

          CREDS=$(echo "$GERRIT_CREDENTIALS" | \
            jq -r --arg slug "$SERVER_SLUG" '.[] | select(.slug == $slug)')

          if [ -z "$CREDS" ]; then
            echo "::error::No credentials found for slug: $SERVER_SLUG"
            exit 1
          fi

          USERNAME=$(echo "$CREDS" | jq -r '.username')
          PASSWORD=$(echo "$CREDS" | jq -r '.password')
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      # ================================================================
      # TUNNEL SETUP (optional, before Gerrit)
      # ================================================================

      - name: "Calculate local ports"
        id: ports
        if: inputs.remote_access != 'None'
        env:
          SERVER_SLUG: ${{ matrix.server.slug }}
          DEBUG_MATRIX: ${{ needs.prepare.outputs.debug_matrix }}
        run: |
          # Calculate deterministic local ports
          # These match what gerrit-action will use (BASE_PORT + index)
          BASE_HTTP_PORT=8080
          BASE_SSH_PORT=29418

          # Find index of this server in the debug matrix
          INDEX=$(echo "$DEBUG_MATRIX" | jq -r --arg slug "$SERVER_SLUG" \
            'to_entries | .[] | select(.value.slug == $slug) | .key')
          INDEX=${INDEX:-0}

          HTTP_PORT=$((BASE_HTTP_PORT + INDEX))
          SSH_PORT=$((BASE_SSH_PORT + INDEX))

          {
            echo "http_port=$HTTP_PORT"
            echo "ssh_port=$SSH_PORT"
            echo "index=$INDEX"
          } >> "$GITHUB_OUTPUT"

          echo "Local ports calculated (index $INDEX):"
          echo "  HTTP: $HTTP_PORT"
          echo "  SSH:  $SSH_PORT"

      - name: "Install bore"
        if: inputs.remote_access == 'Bore'
        run: |
          # Install bore TCP tunnel client
          BORE_VERSION="0.5.2"
          BORE_URL="https://github.com/ekzhang/bore/releases/download"
          BORE_FILE="bore-v${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz"

          echo "Downloading bore v${BORE_VERSION}..."
          curl -sSL "${BORE_URL}/v${BORE_VERSION}/${BORE_FILE}" | tar xz

          ./bore --version
          sudo mv bore /usr/local/bin/
          echo "bore installed successfully ✅"

      - name: "Start bore tunnels"
        id: tunnels
        if: inputs.remote_access == 'Bore'
        env:
          LOCAL_HTTP: ${{ steps.ports.outputs.http_port }}
          LOCAL_SSH: ${{ steps.ports.outputs.ssh_port }}
          SERVER_SLUG: ${{ matrix.server.slug }}
        run: |
          # Start bore tunnels BEFORE Gerrit container
          echo "Starting bore tunnels to bore.pub..."

          # Start HTTP tunnel
          bore local "$LOCAL_HTTP" --to bore.pub > bore-http.log 2>&1 &
          HTTP_PID=$!

          # Start SSH tunnel
          bore local "$LOCAL_SSH" --to bore.pub > bore-ssh.log 2>&1 &
          SSH_PID=$!

          {
            echo "http_pid=$HTTP_PID"
            echo "ssh_pid=$SSH_PID"
            echo "local_http_port=$LOCAL_HTTP"
            echo "local_ssh_port=$LOCAL_SSH"
          } >> "$GITHUB_OUTPUT"

          # Wait for tunnels to establish
          echo "Waiting for tunnels to establish..."
          MAX_WAIT=30
          WAIT_INTERVAL=2
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))

            HTTP_RUNNING=true
            SSH_RUNNING=true
            if ! kill -0 "$HTTP_PID" 2>/dev/null; then
              HTTP_RUNNING=false
            fi
            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              SSH_RUNNING=false
            fi

            HTTP_PORT=$(grep -oP 'listening at bore\.pub:\K\d+' \
              bore-http.log 2>/dev/null || echo "")
            SSH_PORT=$(grep -oP 'listening at bore\.pub:\K\d+' \
              bore-ssh.log 2>/dev/null || echo "")

            if [ -n "$HTTP_PORT" ] && [ -n "$SSH_PORT" ]; then
              echo "Tunnels established after ${ELAPSED}s"
              break
            fi

            if [ "$HTTP_RUNNING" = "false" ] && [ -z "$HTTP_PORT" ]; then
              echo "HTTP tunnel process exited unexpectedly"
              break
            fi
            if [ "$SSH_RUNNING" = "false" ] && [ -z "$SSH_PORT" ]; then
              echo "SSH tunnel process exited unexpectedly"
              break
            fi

            echo "  Waiting... (${ELAPSED}s/${MAX_WAIT}s)"
          done

          # Final port extraction
          HTTP_PORT=$(grep -oP 'listening at bore\.pub:\K\d+' \
            bore-http.log 2>/dev/null || echo "")
          SSH_PORT=$(grep -oP 'listening at bore\.pub:\K\d+' \
            bore-ssh.log 2>/dev/null || echo "")

          if [ -n "$HTTP_PORT" ] && [ -n "$SSH_PORT" ]; then
            # Use -c for compact JSON to avoid multi-line output issues
            TUNNEL_PORTS=$(jq -c -n \
              --arg slug "$SERVER_SLUG" \
              --argjson http "$HTTP_PORT" \
              --argjson ssh "$SSH_PORT" \
              '{($slug): {http: $http, ssh: $ssh}}')

            {
              echo "tunnels_ok=true"
              echo "bore_host=bore.pub"
              echo "http_port=$HTTP_PORT"
              echo "ssh_port=$SSH_PORT"
              echo "tunnel_ports=$TUNNEL_PORTS"
            } >> "$GITHUB_OUTPUT"

            echo "Bore tunnels established successfully ✅"
            echo "  HTTP: bore.pub:$HTTP_PORT -> localhost:$LOCAL_HTTP"
            echo "  SSH:  bore.pub:$SSH_PORT -> localhost:$LOCAL_SSH"
          else
            HTTP_ERR=$(head -1 bore-http.log 2>/dev/null || echo "unknown")
            SSH_ERR=$(head -1 bore-ssh.log 2>/dev/null || echo "unknown")

            echo ""
            echo "❌ Bore tunnel setup failed"
            if [ "$HTTP_ERR" = "$SSH_ERR" ]; then
              echo "  Error: $HTTP_ERR"
            else
              [ -z "$HTTP_PORT" ] && echo "  HTTP: $HTTP_ERR"
              [ -z "$SSH_PORT" ] && echo "  SSH: $SSH_ERR"
            fi

            {
              echo "## ❌ Bore Tunnel Setup Failed"
              echo ""
              if [ "$HTTP_ERR" = "$SSH_ERR" ]; then
                echo "$HTTP_ERR"
              else
                [ -z "$HTTP_PORT" ] && echo "- **HTTP:** $HTTP_ERR"
                [ -z "$SSH_PORT" ] && echo "- **SSH:** $SSH_ERR"
              fi
              echo ""
              echo "bore.pub may be down, or port 7835 is blocked."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Bore tunnel setup failed. Check job summary."
            exit 1
          fi

      # ================================================================
      # TAILSCALE SETUP (optional, before Gerrit)
      # ================================================================

      - name: "Connect to Tailscale"
        id: tailscale
        if: inputs.remote_access == 'Tailscale'
        # yamllint disable-line rule:line-length
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9  # v4.1.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gerrit-ci-${{ matrix.server.slug }}

      - name: "Configure Tailscale tunnels"
        id: tailscale-tunnel
        if: inputs.remote_access == 'Tailscale'
        env:
          LOCAL_HTTP: ${{ steps.ports.outputs.http_port }}
          LOCAL_SSH: ${{ steps.ports.outputs.ssh_port }}
          SERVER_SLUG: ${{ matrix.server.slug }}
        run: |
          # Get Tailscale IP and configure tunnel info
          TAILSCALE_IP=$(tailscale ip -4)
          echo "Tailscale IP: $TAILSCALE_IP"

          HTTP_PORT="${LOCAL_HTTP}"
          SSH_PORT="${LOCAL_SSH}"

          # Build tunnel_ports JSON matching gerrit-action format
          TUNNEL_PORTS=$(jq -c -n \
            --arg slug "$SERVER_SLUG" \
            --argjson http "$HTTP_PORT" \
            --argjson ssh "$SSH_PORT" \
            '{($slug): {http: $http, ssh: $ssh}}')

          {
            echo "tailscale_ip=$TAILSCALE_IP"
            echo "http_port=$HTTP_PORT"
            echo "ssh_port=$SSH_PORT"
            echo "local_http_port=$LOCAL_HTTP"
            echo "local_ssh_port=$LOCAL_SSH"
            echo "tunnel_ports=$TUNNEL_PORTS"
          } >> "$GITHUB_OUTPUT"

          echo "Tailscale tunnel configured ✅"
          echo "  HTTP: $TAILSCALE_IP:$HTTP_PORT"
          echo "  SSH:  $TAILSCALE_IP:$SSH_PORT"

      # ================================================================
      # START GERRIT
      # ================================================================

      - name: "Start Gerrit mirror: ${{ matrix.server.name }}"
        id: gerrit
        # Ref controlled by gerrit_action_ref input; defaults to
        # upstream main when unset (see checkout step above)
        uses: ./.gerrit-action
        with:
          gerrit_setup: |
            [{
              "project": "${{ matrix.server.project_filter || '' }}",
              "slug": "${{ matrix.server.slug }}",
              "gerrit": "${{ matrix.server.gerrit }}",
              "api_path": "${{ matrix.server.api_path }}"
            }]
          auth_type: http_basic
          http_username: ${{ steps.credentials.outputs.username }}
          http_password: ${{ steps.credentials.outputs.password }}
          ssh_auth_keys: ${{ vars.GERRIT_PUBLIC_KEYS }}
          ssh_auth_username: 'modesevenindustrialsolutions'
          sync_on_startup: ${{ inputs.sync_on_startup }}
          use_api_path: ${{ inputs.match_api_path }}
          debug: ${{ needs.validate.outputs.effective_debug }}
          check_service: true
          exit: false
          tunnel_host: >-
            ${{
              inputs.remote_access == 'Bore' && 'bore.pub' ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tailscale_ip ||
              ''
            }}
          tunnel_ports: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.tunnel_ports ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tunnel_ports ||
              ''
            }}
          # G2P (gerrit_to_platform) integration
          # Target org: modeseven-gerrit-<slug> (must contain "gerrit")
          g2p_enable: >-
            ${{ inputs.configure_g2p == true && 'true' || 'false' }}
          g2p_github_token: >-
            ${{
              inputs.configure_g2p == true &&
                secrets.G2P_GITHUB_TOKEN || ''
            }}
          # yamllint disable-line rule:line-length
          g2p_github_owner: "modeseven-gerrit-${{ matrix.server.slug }}"
          g2p_remote_name_style: 'dash'
          g2p_validation_mode: 'warn'
          g2p_org_setup: ${{ inputs.g2p_org_setup }}
          g2p_org_token_map: >-
            ${{
              inputs.g2p_org_setup == 'provision' &&
                secrets.G2P_ORG_TOKENS || ''
            }}

      - name: "Verify tunnel connectivity"
        if: inputs.remote_access != 'None'
        shell: bash
        env:
          TUNNEL_HOST: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.bore_host ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tailscale_ip ||
              ''
            }}
          HTTP_PORT: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.http_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.http_port ||
              ''
            }}
          API_PATH: ${{ matrix.server.api_path }}
          MATCH_API_PATH: ${{ inputs.match_api_path }}
          DEBUG: ${{ needs.validate.outputs.effective_debug }}
          MAX_ATTEMPTS: "5"
          RETRY_DELAY: "3"
        run: |
          # Verify the tunnel is working by hitting Gerrit through it
          echo "Verifying tunnel connectivity..."

          EFFECTIVE_API_PATH=""
          if [ "${MATCH_API_PATH:-false}" = "true" ] && [ -n "$API_PATH" ]; then
            EFFECTIVE_API_PATH="$API_PATH"
          fi

          if [ -n "$EFFECTIVE_API_PATH" ]; then
            URL="http://${TUNNEL_HOST}:${HTTP_PORT}${EFFECTIVE_API_PATH}/config/server/version"
          else
            URL="http://${TUNNEL_HOST}:${HTTP_PORT}/config/server/version"
          fi

          echo "Testing: $URL"

          MAX_ATTEMPTS=5
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if echo "$HTTP_CODE" | grep -q "200"; then
              VERSION=$(curl -s "$URL" | tr -d '")' | tail -1)
              echo "Tunnel verified ✅ (Gerrit $VERSION)"
              exit 0
            fi
            echo "  Attempt $i/$MAX_ATTEMPTS failed, retrying..."
            sleep 3
          done

          echo "::warning::Could not verify tunnel connectivity"
          echo "Gerrit may still be starting up"

      - name: "Display connection info"
        env:
          REMOTE_ACCESS: ${{ inputs.remote_access }}
          TUNNEL_HOST: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.bore_host ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tailscale_ip ||
              ''
            }}
          TUNNEL_HTTP_PORT: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.http_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.http_port ||
              ''
            }}
          TUNNEL_SSH_PORT: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.ssh_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.ssh_port ||
              ''
            }}
          TUNNEL_LOCAL_HTTP: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.local_http_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.local_http_port ||
              ''
            }}
          TUNNEL_LOCAL_SSH: >-
            ${{
              inputs.remote_access == 'Bore' &&
                steps.tunnels.outputs.local_ssh_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.local_ssh_port ||
              ''
            }}
          PERSIST_MINUTES: ${{ needs.validate.outputs.persist_minutes }}
          SERVER_NAME: ${{ matrix.server.name }}
          API_PATH: ${{ matrix.server.api_path }}
          SERVER_SLUG: ${{ matrix.server.slug }}
          MATCH_API_PATH: ${{ inputs.match_api_path }}
          G2P_ENABLED: ${{ steps.gerrit.outputs.g2p_enabled }}
          G2P_GITHUB_OWNER: ${{ steps.gerrit.outputs.g2p_github_owner }}
          G2P_HOOKS_ENABLED: ${{ steps.gerrit.outputs.g2p_hooks_enabled }}
          G2P_TOKEN_PROVIDED: ${{ steps.gerrit.outputs.g2p_token_provided }}
        run: |
          # Display connection information
          if [ "$REMOTE_ACCESS" != "None" ] && [ -n "$TUNNEL_HOST" ]; then
            REMOTE_HOST="$TUNNEL_HOST"
            HTTP_PORT="$TUNNEL_HTTP_PORT"
            SSH_PORT="$TUNNEL_SSH_PORT"
            LOCAL_HTTP="$TUNNEL_LOCAL_HTTP"
            LOCAL_SSH="$TUNNEL_LOCAL_SSH"
          else
            REMOTE_HOST="localhost"
            HTTP_PORT="8080"
            SSH_PORT="29418"
            LOCAL_HTTP="8080"
            LOCAL_SSH="29418"
          fi

          declare -a TUNNELS=()

          EFFECTIVE_API_PATH=""
          if [ "${MATCH_API_PATH:-false}" = "true" ] && [ -n "$API_PATH" ]; then
            EFFECTIVE_API_PATH="$API_PATH"
          fi

          if [ -n "$HTTP_PORT" ]; then
            if [ -n "$EFFECTIVE_API_PATH" ]; then
              HTTP_URL="http://${REMOTE_HOST}:${HTTP_PORT}${EFFECTIVE_API_PATH}/"
            else
              HTTP_URL="http://${REMOTE_HOST}:${HTTP_PORT}/"
            fi
            TUNNELS+=("http|Web UI|$LOCAL_HTTP|$HTTP_PORT|$HTTP_URL")
          fi
          if [ -n "$SSH_PORT" ]; then
            SSH_URL="ssh://admin@${REMOTE_HOST}:${SSH_PORT}"
            TUNNELS+=("ssh|SSH/Git|$LOCAL_SSH|$SSH_PORT|$SSH_URL")
          fi

          {
            echo "# 🖥️ Gerrit Server Online: $SERVER_NAME"
            echo ""
            echo "## 🌐 Public Access Ports"
            echo ""
            echo "| Service | Local Port | Public Port | Public URL |"
            echo "|---------|------------|-------------|------------|"

            for t in "${TUNNELS[@]}"; do
              IFS='|' read -r _ LABEL LOCAL PUBLIC URL <<< "$t"
              echo "| **$LABEL** | $LOCAL | $PUBLIC | \`$URL\` |"
            done

            echo ""
            echo "## 🔗 Quick Access"
            echo ""

            if [ -n "$HTTP_PORT" ]; then
              echo "### Gerrit Web Portal"
              echo ""
              if [ -n "$EFFECTIVE_API_PATH" ]; then
                echo "**URL**:" \
                  "http://$REMOTE_HOST:$HTTP_PORT$EFFECTIVE_API_PATH/"
              else
                echo "**URL**: http://$REMOTE_HOST:$HTTP_PORT/"
              fi
              echo ""
              echo '```bash'
              echo "# Check version"
              if [ -n "$EFFECTIVE_API_PATH" ]; then
                URL="http://$REMOTE_HOST:$HTTP_PORT$EFFECTIVE_API_PATH"
              else
                URL="http://$REMOTE_HOST:$HTTP_PORT"
              fi
              echo "curl -s $URL/config/server/version"
              echo ""
              echo "# List projects"
              echo "curl -s $URL/projects/"
              echo '```'
              echo ""
            fi

            if [ -n "$SSH_PORT" ]; then
              echo "### SSH Access"
              echo ""
              echo '```bash'
              echo "# Test connection"
              echo "ssh -p $SSH_PORT admin@$REMOTE_HOST gerrit version"
              echo ""
              echo "# Clone a repository"
              echo "git clone ssh://admin@$REMOTE_HOST:$SSH_PORT/PROJECT_NAME"
              echo '```'
              echo ""
            fi

            echo "## ⏱️ Session Info"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Server | $SERVER_NAME (\`$SERVER_SLUG\`) |"
            echo "| Duration | $PERSIST_MINUTES minutes |"
            DATE_FMT='+%Y-%m-%d %H:%M:%S %Z'
            EXPIRY=$(date -d "+$PERSIST_MINUTES minutes" "$DATE_FMT" \
              2>/dev/null || date -v+"${PERSIST_MINUTES}"M "$DATE_FMT")
            echo "| Expires | $EXPIRY |"
            echo ""
            if [ "${G2P_ENABLED:-false}" = "true" ]; then
              echo "## 🔄 Gerrit to Platform (G2P)"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Target Org | \`$G2P_GITHUB_OWNER\` |"
              echo "| Token | ${G2P_TOKEN_PROVIDED:-false} |"
              echo "| Hooks | $G2P_HOOKS_ENABLED |"
              echo ""
            fi
            if [ "$REMOTE_ACCESS" != "None" ]; then
              echo "> ⚠️ **Warning**: URLs are publicly accessible!"
            else
              echo "> ℹ️ **Note**: Local access only (remote access disabled)"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "========================================"
          echo "  GERRIT SERVER ONLINE"
          echo "========================================"
          for t in "${TUNNELS[@]}"; do
            IFS='|' read -r _ LABEL _ _ URL <<< "$t"
            printf "  %-10s %s\n" "$LABEL:" "$URL"
          done
          echo "  Duration:  $PERSIST_MINUTES minutes"
          echo "========================================"
          echo ""

      - name: "Keep session alive"
        env:
          PERSIST_MINUTES: ${{ needs.validate.outputs.persist_minutes }}
          REMOTE_ACCESS: ${{ inputs.remote_access }}
        run: |
          # Keep the session alive for the specified duration
          echo "Session will remain active for $PERSIST_MINUTES minutes..."
          echo "Cancel the workflow manually when you're done."
          echo ""

          TOTAL_SECONDS=$((PERSIST_MINUTES * 60))
          ELAPSED=0
          INTERVAL=60

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            echo "[$(date '+%H:%M:%S')] $REMAINING minutes remaining..."

            if [ "$REMOTE_ACCESS" = "Bore" ]; then
              if ! pgrep -f "bore local" > /dev/null; then
                echo "::warning::bore tunnels have stopped unexpectedly"
                echo "HTTP tunnel log:"
                cat bore-http.log 2>/dev/null || echo "(no log)"
                echo "SSH tunnel log:"
                cat bore-ssh.log 2>/dev/null || echo "(no log)"
              fi
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Session time expired."

      - name: "Cleanup"
        if: always()
        env:
          CONTAINER_IDS: ${{ steps.gerrit.outputs.container_ids }}
          REMOTE_ACCESS: ${{ inputs.remote_access }}
        run: |
          # Cleanup tunnels and containers
          echo "Cleaning up..."

          if [ "$REMOTE_ACCESS" = "Bore" ]; then
            pkill -f "bore local" 2>/dev/null || true
          fi
          # Note: Tailscale cleanup is handled by its action's post step

          if [ -n "$CONTAINER_IDS" ]; then
            echo "$CONTAINER_IDS" | jq -r '.[]' 2>/dev/null | \
              while IFS= read -r cid; do
                [ -z "$cid" ] && continue
                echo "Stopping container: $cid"
                docker kill "$cid" 2>/dev/null || true
                echo "Removing container: $cid"
                docker rm "$cid" 2>/dev/null || true
              done
          fi

          echo "Cleanup complete ✅"

  ### Resync GitHub Organizations with Gerrit Content ###
  resync-orgs-prepare:
    name: "Prepare resync matrix"
    runs-on: ubuntu-latest
    if: ${{ inputs.reset_orgs == true || inputs.sync_orgs == true }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d  # v2.16.1
        with:
          egress-policy: audit

      - name: "Build resync matrix from GERRIT_SERVERS"
        id: build-matrix
        env:
          GERRIT_SERVERS: ${{ vars.GERRIT_SERVERS }}
          RESYNC_PROJECT_SLUGS: ${{ inputs.sync_project_slugs }}
        run: |
          # Build matrix with all github orgs (github_org and github_gerrit_org)
          # Each entry maps a GitHub org to its source Gerrit server
          if [ -z "$GERRIT_SERVERS" ]; then
            echo "::error::GERRIT_SERVERS variable is not set"
            exit 1
          fi

          # Validate JSON
          if ! echo "$GERRIT_SERVERS" | jq empty 2>/dev/null; then
            echo "::error::GERRIT_SERVERS is not valid JSON"
            exit 1
          fi

          # Build full matrix: for each server, create entries for both
          # github_org and github_gerrit_org
          # include_projects/exclude_projects are optional fields in
          # GERRIT_SERVERS; when absent they default to empty string.
          # These are passed through to gerrit-clone mirror as
          # --include-projects / --exclude-projects CLI arguments.
          FULL_MATRIX=$(echo "$GERRIT_SERVERS" | jq -c '
            [.[] |
              {
                github_org: .github_org,
                gerrit: .gerrit,
                api_path: .api_path,
                name: .name,
                slug: .slug,
                include_projects: (.include_projects // ""),
                exclude_projects: (.exclude_projects // "")
              },
              {
                github_org: .github_gerrit_org,
                gerrit: .gerrit,
                api_path: .api_path,
                name: .name,
                slug: .slug,
                include_projects: (.include_projects // ""),
                exclude_projects: (.exclude_projects // "")
              }
            ]
          ')

          FULL_COUNT=$(echo "$FULL_MATRIX" | jq '. | length')
          echo "Full matrix has $FULL_COUNT GitHub organizations"

          # Apply resync_project_slugs filter
          if [ -z "$RESYNC_PROJECT_SLUGS" ] || \
             [ "$RESYNC_PROJECT_SLUGS" = "all" ]; then
            # Empty selector or "all" = all orgs
            MATRIX="$FULL_MATRIX"
            echo "Using all $FULL_COUNT GitHub organizations (no selector)"
          else
            # Parse comma/space-separated selectors and support wildcards
            # Convert to newline-separated, trim whitespace
            SELECTORS=$(echo "$RESYNC_PROJECT_SLUGS" \
              | tr ',' '\n' | tr ' ' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -v '^$')

            echo "GitHub org selectors to match:"
            echo "$SELECTORS"

            # Build jq filter for each selector (wildcards supported)
            # Convert shell wildcards to regex: * -> .*, ? -> .
            MATRIX=$(echo "$FULL_MATRIX" | jq -c --arg selectors "$SELECTORS" '
              ($selectors | split("\n")) as $sels |
              [.[] | . as $org |
                select(
                  any($sels[]; . as $sel |
                    if ($sel | contains("*")) or ($sel | contains("?")) then
                      # Convert glob to regex: * -> .*, ? -> .
                      ($sel | gsub("\\*"; ".*") | gsub("\\?"; ".")) as $regex |
                      ($org.github_org | test("^" + $regex + "$"))
                    else
                      $org.github_org == $sel
                    end
                  )
                )
              ]
            ')
            MATCH_COUNT=$(echo "$MATRIX" | jq '. | length')
            if [ "$MATCH_COUNT" -eq 0 ]; then
              echo "::error::No GitHub orgs matched" \
                "selector: $RESYNC_PROJECT_SLUGS"
              echo "Available GitHub organizations:"
              echo "$FULL_MATRIX" | jq -r '.[].github_org'
              exit 1
            fi
            echo "Matched $MATCH_COUNT orgs (selector: $RESYNC_PROJECT_SLUGS)"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$MATRIX" | jq '. | length')
          echo "Resync matrix prepared with $COUNT GitHub organizations"
          echo "$MATRIX" | jq '.'

  reset-orgs:
    name: "Reset: ${{ matrix.org.github_org }}"
    runs-on: ubuntu-latest
    needs: [validate, resync-orgs-prepare]
    if: ${{ inputs.reset_orgs == true }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        org: ${{ fromJSON(needs.resync-orgs-prepare.outputs.matrix) }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d  # v2.16.1
        with:
          egress-policy: audit

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: false
          # No checkout step in this job; suppress the empty workdir warning
          ignore-empty-workdir: true

      - name: "Install gerrit-clone CLI"
        env:
          CLONE_REF: ${{ inputs.gerrit_clone_ref }}
        run: |
          if [ -n "$CLONE_REF" ]; then
            REPO="${CLONE_REF%%@*}"
            BRANCH="${CLONE_REF#*@}"
            echo "Installing from source: $REPO @ $BRANCH"
            SRC="gerrit-clone @ "
            SRC+="git+https://github.com/"
            SRC+="${REPO}.git@${BRANCH}"
            uv tool install "$SRC"
          else
            echo "Installing gerrit-clone from PyPI"
            uv tool install gerrit-clone
          fi
          gerrit-clone --version

      - name: "Reset GitHub org: ${{ matrix.org.github_org }}"
        env:
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          GITHUB_ORG: ${{ matrix.org.github_org }}
          VERBOSE_DEBUG: ${{ needs.validate.outputs.effective_debug }}
        run: |
          # Verify token is available
          if [ -z "$ORG_ADMIN_TOKEN" ]; then
            echo "::error::ORG_ADMIN_TOKEN secret" \
              "is not set or empty"
            exit 1
          fi
          echo "Token available:" \
            "${#ORG_ADMIN_TOKEN} chars"

          # Reset (delete all repos from) the GitHub org
          echo "Resetting GitHub org: $GITHUB_ORG"
          VERBOSE_ARGS=()
          if [ "$VERBOSE_DEBUG" = "true" ]; then
            VERBOSE_ARGS+=(--verbose)
          fi
          gerrit-clone reset \
            --org "$GITHUB_ORG" \
            --github-token "$ORG_ADMIN_TOKEN" \
            --no-confirm \
            "${VERBOSE_ARGS[@]}"

      - name: "Report reset results"
        if: always()
        env:
          GITHUB_ORG: ${{ matrix.org.github_org }}
        run: |
          {
            echo "## Reset: $GITHUB_ORG"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| GitHub Org | \`$GITHUB_ORG\` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-orgs:
    name: "Sync: ${{ matrix.org.github_org }}"
    runs-on: ubuntu-latest
    needs: [validate, resync-orgs-prepare, reset-orgs]
    # Run when sync is requested, even if reset-orgs was skipped
    if: >-
      ${{ always()
          && inputs.sync_orgs == true
          && needs.validate.result == 'success'
          && needs.resync-orgs-prepare.result == 'success'
          && (needs.reset-orgs.result == 'success'
              || needs.reset-orgs.result == 'skipped') }}
    permissions:
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        org: ${{ fromJSON(needs.resync-orgs-prepare.outputs.matrix) }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d  # v2.16.1
        with:
          egress-policy: audit

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: false
          # No checkout step in this job; suppress the empty workdir warning
          ignore-empty-workdir: true

      - name: "Install gerrit-clone CLI"
        env:
          CLONE_REF: ${{ inputs.gerrit_clone_ref }}
        run: |
          if [ -n "$CLONE_REF" ]; then
            REPO="${CLONE_REF%%@*}"
            BRANCH="${CLONE_REF#*@}"
            echo "Installing from source: $REPO @ $BRANCH"
            SRC="gerrit-clone @ "
            SRC+="git+https://github.com/"
            SRC+="${REPO}.git@${BRANCH}"
            uv tool install "$SRC"
          else
            echo "Installing gerrit-clone from PyPI"
            uv tool install gerrit-clone
          fi
          gerrit-clone --version

      - name: "Mirror Gerrit to GitHub: ${{ matrix.org.github_org }}"
        id: mirror
        env:
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          GITHUB_ORG: ${{ matrix.org.github_org }}
          GERRIT_SERVER: ${{ matrix.org.gerrit }}
          MIRROR_OUTPUT_PATH: "/tmp/mirror-${{ matrix.org.github_org }}"
          VERBOSE_DEBUG: ${{ needs.validate.outputs.effective_debug }}
          # Project filtering (optional, from GERRIT_SERVERS variable)
          INCLUDE_PROJECTS: ${{ matrix.org.include_projects }}
          EXCLUDE_PROJECTS: ${{ matrix.org.exclude_projects }}
          REMOVE_FILES: ${{ inputs.remove_files }}
          GIT_FILTER_PROJECTS: ${{ inputs.git_filter_projects }}
          GIT_FILTER_TOKENS: ${{ secrets.GIT_FILTER_TOKENS }}
        run: |
          # Verify token is available
          if [ -z "$ORG_ADMIN_TOKEN" ]; then
            echo "::error::ORG_ADMIN_TOKEN secret" \
              "is not set or empty"
            exit 1
          fi

          # Mirror all repos from Gerrit to GitHub
          # This is idempotent: missing repos are created, existing
          # repos are pushed to (git push --mirror is a safe no-op
          # when the repo is already up to date).
          echo "Mirroring $GERRIT_SERVER -> $GITHUB_ORG"

          # Build project filtering arguments from matrix values
          # These come from include_projects/exclude_projects fields
          # in the GERRIT_SERVERS repository variable and support
          # comma or space-separated lists of Gerrit project names
          # with shell-style wildcards (*, ?, [seq])
          FILTER_ARGS=()

          if [ -n "$INCLUDE_PROJECTS" ]; then
            # Split on commas and spaces, pass each as a separate arg
            read -ra INCLUDES \
              <<< "$(printf '%s' "$INCLUDE_PROJECTS" | tr ',' ' ')"
            for project in "${INCLUDES[@]}"; do
              project=$(echo "$project" | xargs)  # trim whitespace
              if [ -n "$project" ]; then
                FILTER_ARGS+=(--include-projects "$project")
              fi
            done

          fi

          if [ -n "$EXCLUDE_PROJECTS" ]; then
            # Split on commas and spaces, pass each as a separate arg
            read -ra EXCLUDES \
              <<< "$(printf '%s' "$EXCLUDE_PROJECTS" | tr ',' ' ')"
            for project in "${EXCLUDES[@]}"; do
              project=$(echo "$project" | xargs)  # trim whitespace
              if [ -n "$project" ]; then
                FILTER_ARGS+=(--exclude-projects "$project")
              fi
            done
          fi

          # Content filtering: remove file patterns
          if [ -n "$REMOVE_FILES" ]; then
            FILTER_ARGS+=(--remove-files "$REMOVE_FILES")
          fi

          # Content filtering: git history token replacement
          # GIT_FILTER_PROJECTS holds project patterns (from input)
          # GIT_FILTER_TOKENS holds the actual secrets (from repo secret)
          # Format expected by --git-filter:
          #   'project:token1,token2;project2:token3'
          # Assemble the spec by pairing each project with the token(s)
          if [ -n "$GIT_FILTER_PROJECTS" ] && [ -n "$GIT_FILTER_TOKENS" ]; then
            GIT_FILTER_SPEC=""
            IFS=';' read -ra PROJECTS <<< "$GIT_FILTER_PROJECTS"
            IFS=';' read -ra TOKENS <<< "$GIT_FILTER_TOKENS"
            for i in "${!PROJECTS[@]}"; do
              proj=$(echo "${PROJECTS[$i]}" | xargs)
              # Use matching token or last available token
              if [ "$i" -lt "${#TOKENS[@]}" ]; then
                tok=$(echo "${TOKENS[$i]}" | xargs)
              else
                tok=$(echo "${TOKENS[-1]}" | xargs)
              fi
              if [ -n "$proj" ] && [ -n "$tok" ]; then
                if [ -n "$GIT_FILTER_SPEC" ]; then
                  GIT_FILTER_SPEC+=";${proj}:${tok}"
                else
                  GIT_FILTER_SPEC="${proj}:${tok}"
                fi
              fi
            done
            if [ -n "$GIT_FILTER_SPEC" ]; then
              FILTER_ARGS+=(--git-filter "$GIT_FILTER_SPEC")
            fi
          fi

          # Capture exit code so manifest parsing runs even on
          # partial failure (exit code 7 = some clones failed)
          MIRROR_RC=0
          VERBOSE_ARGS=()
          if [ "$VERBOSE_DEBUG" = "true" ]; then
            VERBOSE_ARGS+=(--verbose)
          fi
          gerrit-clone mirror \
            --server "$GERRIT_SERVER" \
            --org "$GITHUB_ORG" \
            --github-token "$ORG_ADMIN_TOKEN" \
            --output-path "$MIRROR_OUTPUT_PATH" \
            --overwrite \
            --no-mirror \
            --discovery-method http \
            --https \
            "${VERBOSE_ARGS[@]}" \
            "${FILTER_ARGS[@]}" || MIRROR_RC=$?

          # Extract counts from manifest for downstream reporting
          MANIFEST="$MIRROR_OUTPUT_PATH/mirror-manifest.json"
          if [ -f "$MANIFEST" ]; then
            SUCCESS_COUNT=$(jq -r '.succeeded // 0' "$MANIFEST")
            FAILURE_COUNT=$(jq -r '.failed // 0' "$MANIFEST")
            TOTAL_COUNT=$(jq -r '.total // 0' "$MANIFEST")
          else
            echo "::warning::Mirror manifest not found at $MANIFEST"
            SUCCESS_COUNT=0
            FAILURE_COUNT=0
            TOTAL_COUNT=0
          fi

          {
            echo "success-count=$SUCCESS_COUNT"
            echo "failure-count=$FAILURE_COUNT"
            echo "total-count=$TOTAL_COUNT"
          } >> "$GITHUB_OUTPUT"

          # Re-exit with the original code so the step still
          # reports failure when there were clone errors
          exit "$MIRROR_RC"

      - name: "Report sync results"
        if: always()
        env:
          GITHUB_ORG: ${{ matrix.org.github_org }}
          GERRIT_SERVER: ${{ matrix.org.gerrit }}
          SUCCESS_COUNT: ${{ steps.mirror.outputs.success-count }}
          FAILURE_COUNT: ${{ steps.mirror.outputs.failure-count }}
          TOTAL_COUNT: ${{ steps.mirror.outputs.total-count }}
          INCLUDE_PROJECTS: ${{ matrix.org.include_projects }}
          EXCLUDE_PROJECTS: ${{ matrix.org.exclude_projects }}
        run: |
          {
            echo "## Sync: $GITHUB_ORG"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| GitHub Org | \`$GITHUB_ORG\` |"
            echo "| Gerrit Server | \`$GERRIT_SERVER\` |"
            echo "| Status | ${{ job.status }} |"
            echo "| Total | $TOTAL_COUNT |"
            echo "| Succeeded | $SUCCESS_COUNT |"
            echo "| Failed | $FAILURE_COUNT |"
            if [ -n "$INCLUDE_PROJECTS" ]; then
              echo "| Include Filter | \`$INCLUDE_PROJECTS\` |"
            fi
            if [ -n "$EXCLUDE_PROJECTS" ]; then
              echo "| Exclude Filter | \`$EXCLUDE_PROJECTS\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  ### Summary job ###
  summary:
    name: "Test Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - validate
      - prepare
      - deploy-gerrit
      - reset-orgs
      - sync-orgs
    if: always()
    permissions:
      contents: read
    steps:
      - name: "Generate summary"
        env:
          PERSIST_MINUTES: ${{ needs.validate.outputs.persist_minutes }}
          DEBUG_COUNT: ${{ needs.prepare.outputs.debug_count }}
          RESET_ORGS: ${{ inputs.reset_orgs }}
          SYNC_ORGS: ${{ inputs.sync_orgs }}
          CONFIGURE_G2P: ${{ inputs.configure_g2p }}
        run: |
          # Generate test summary
          {
            echo "# Gerrit Server Test Results 📊"
            echo ""
            echo "| Status | Details |"
            echo "|--------|---------|"
            echo "| Validation | ${{ needs.validate.result }} |"
            echo "| Preparation | ${{ needs.prepare.result }} |"
            if [ "$PERSIST_MINUTES" != "0" ] && \
               [ "$DEBUG_COUNT" != "0" ]; then
              echo "| Deploy Gerrit ($DEBUG_COUNT) \
                | ${{ needs.deploy-gerrit.result }} |"
            elif [ "$DEBUG_COUNT" = "0" ]; then
              echo "| Deploy Gerrit | skipped (selector: none) |"
            fi
            if [ "$RESET_ORGS" = "true" ]; then
              echo "| Reset Orgs \
                | ${{ needs.reset-orgs.result }} |"
            fi
            if [ "$SYNC_ORGS" = "true" ]; then
              echo "| Sync Orgs \
                | ${{ needs.sync-orgs.result }} |"
            fi
            if [ "$CONFIGURE_G2P" = "true" ]; then
              echo "| G2P Integration | enabled |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Check overall result"
        if: >-
          needs.deploy-gerrit.result == 'failure'
          || needs.reset-orgs.result == 'failure'
          || needs.sync-orgs.result == 'failure'
        run: |
          echo "::error::One or more jobs failed"
          exit 1
