---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Test Gerrit server connectivity workflow
name: "Test Deploy Gerrit 🔗"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug output"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      sync_on_startup:
        description: "Trigger replication after startup"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      skip_archived_projects:
        # Restricts the project list fetched from the source Gerrit to
        # state=ACTIVE projects.  Archived (READ_ONLY) and hidden
        # projects are excluded server-side via the REST query, so
        # pull-replication never pre-creates local directories for
        # them and the initial sync skips that traffic entirely.
        # Roughly halves cold-start replication time on instances with
        # large historical archives (ONAP: 181 active + 214 read_only
        # = 395 total).  Disable when a specific archived repository
        # needs to be mirrored — e.g. for backfill or one-off
        # debugging against an archived project.
        description: >-
          Skip archived (read-only) Gerrit projects during initial
          sync (faster startup; set false to include them)
        required: false
        default: true
        type: boolean
      persist_project_slugs:
        # Supports: 'none', 'all', single value, comma/space-separated,
        # wildcards (*,?). Use 'none' to disable persistent sessions.
        description: "Persistent session selector (project slug)"
        required: false
        default: "onap"
        type: string
      persist_minutes:
        description: "Persistent session duration (minutes, 0 to skip, max 600)"
        required: false
        default: 15
        type: number
      match_api_path:
        # e.g., /r, /infra
        description: "Match origin server API URL/path"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      remote_access:
        # Makes Gerrit instance accessible from outside GitHub via one
        # of three tunnelling backends:
        #   * 'None'                  - no remote access (Tailscale-
        #                               free, bore-free run).
        #   * 'Bore (bore.pub)'       - public bore relay run by
        #                               ekzhang.  Flaky in practice;
        #                               blocked by many corporate
        #                               DNS filters as a tunnel
        #                               service.
        #   * 'Bore (modeseven.org)'  - private bore broker running
        #                               on AWS at modeseven.org
        #                               (control port 7835, port
        #                               range 40000-40100).  Uses
        #                               the BORE_MODESEVEN_ORG repo
        #                               secret for shared-secret
        #                               authentication.
        #   * 'Tailscale'             - tailnet-based access using
        #                               TS_OAUTH_CLIENT_ID /
        #                               TS_OAUTH_SECRET.
        description: "Enable remote Gerrit access"
        required: false
        default: "Tailscale"
        type: choice
        options:
          - "None"
          - "Bore (bore.pub)"
          - "Bore (modeseven.org)"
          - "Tailscale"
      reset_orgs:
        description: "Reset (delete all repos from) GitHub ORGs"
        required: false
        default: false
        type: boolean
      sync_orgs:
        description: "Sync GitHub ORGs from Gerrit"
        required: false
        default: false
        type: boolean
      sync_project_slugs:
        # Supports: 'all', single value, comma/space-separated, wildcards (*,?)
        description: "GitHub orgs to reset/sync (selector)"
        required: false
        default: "all"
        type: string
      gerrit_clone_ref:
        # e.g. modeseven-lfreleng-actions/gerrit-clone-action@fix-github-bugs
        # When unset, defaults to installing/running from PyPI with 'uvx'
        description: "Build gerrit-clone from git ref"
        required: false
        # yamllint disable-line rule:line-length
        default: "modeseven-lfreleng-actions/gerrit-clone-action@feat/content-filtering"
        type: string
      gerrit_action_ref:
        # e.g. modeseven-lfreleng-actions/gerrit-action@fix/docker-pep668
        # Format: owner/repo@branch (checked out and used locally)
        # When unset, defaults to upstream main branch
        description: "Use gerrit-action from git ref"
        required: false
        default: "lfreleng-actions/gerrit-action@main"
        type: string
      configure_g2p:
        # Configures gerrit_to_platform inside the deployed Gerrit
        # container. Only effective when persistent sessions are
        # active (selector is not 'none'). The target GitHub org is
        # taken from the server's github_gerrit_org field, falling
        # back to the slug-derived "modeseven-gerrit-<slug>" form
        # when that optional field is absent or empty.
        description: "Configure Gerrit to Platform (g2p)"
        required: false
        default: true
        type: boolean
      rewrite_gitreview:
        # Rewrites .gitreview in every replicated/cloned project so
        # clones from this short-lived test Gerrit point at the test
        # instance rather than the upstream production Gerrit.
        # Modes: 'Leave unchanged' (skip); 'Change with new commit'
        # (append a synthetic Chore commit per branch tip); 'Change by
        # amended commit' (rebuild the tip in place, swapping only the
        # tree). Host/port derive from 'remote_access' (Bore tunnel,
        # Tailscale node IP, or the runner's public IPv4 for 'None').
        description: "Update .gitreview host and port"
        required: false
        default: "Change by amended commit"
        type: choice
        options:
          - "Leave unchanged"
          - "Change with new commit"
          - "Change by amended commit"
      create_missing_gitreview:
        # Creates a .gitreview file in every replicated/cloned
        # project whose branch tip is missing one.  Only the
        # 'host' and 'port' values are sourced from an existing
        # .gitreview found on another repo's default-branch (HEAD)
        # tip (the first match wins; non-default branches are not
        # scanned) so the new files point at the same Gerrit as
        # the rest of the estate; any other keys, comments or
        # whitespace in that source file are NOT reproduced.  The
        # generated .gitreview is a minimal fixed-key file with
        # exactly:
        #
        #     [gerrit]
        #     host=<from estate>
        #     port=<from estate, default 29418>
        #     project=<bare repo path, '.git' stripped>
        #     defaultbranch=<branch name from HEAD, 'refs/heads/' stripped>
        #
        # When 'rewrite_gitreview' also requests a rewrite, the
        # rewrite step runs afterwards and re-targets the newly
        # created files at the test deployment in the same pass.
        # The creation step honours the same commit strategy
        # chosen for 'rewrite_gitreview': it amends the existing
        # tip commit in place under 'Change by amended commit' and
        # appends a synthetic 'Chore: Add missing .gitreview'
        # commit otherwise.
        description: "Create .gitreview file where missing"
        required: false
        default: false
        type: boolean
      replicate_open_changes:
        # Pull NoteDb meta refs from the source Gerrit so the
        # deployed test instance renders OPEN CHANGES (votes,
        # comments, status), per-account identities and group
        # memberships in the UI and REST search.  Off by default
        # because it materially increases initial sync size on
        # instances with large review histories (and brings the
        # source's change-number sequence into the test instance,
        # which can collide if anything writes new changes here).
        #
        # When 'true' the workflow passes BOTH
        # 'replicate_meta_refs' (adds refspecs for refs/meta/*,
        # refs/cache-automerge/*, plus a second remote that pulls
        # refs/users/*, refs/groups/*, refs/sequences/*,
        # refs/meta/*, refs/draft-comments/*,
        # refs/starred-changes/* into All-Users and All-Projects)
        # AND 'reindex_after_sync'
        # (runs an online reindex + targeted cache flush inside
        # every container once pull-replication has settled, so
        # the secondary Lucene index actually reflects the
        # replicated NoteDb state) through to gerrit-action.
        #
        # Treat the resulting Gerrit as read-only: any new change
        # uploaded against the test instance risks colliding with
        # the source server's change-number sequence on the next
        # pull-replication cycle.
        description: "Replicate open changes (NoteDb meta refs + reindex)"
        required: false
        default: false
        type: boolean
      g2p_org_setup:
        description: "G2P org setup mode"
        required: false
        type: choice
        options:
          - provision
          - verify
          - skip
        default: 'provision'
      g2p_install_ref:
        # Optional override that re-installs gerrit_to_platform inside
        # the running Gerrit container from a Git ref (branch, tag,
        # commit SHA, or Gerrit change ref such as
        # 'refs/changes/75/74275/2').  When empty the container keeps
        # the version pinned in gerrit-action/docker/requirements.txt;
        # that pin can lag behind upstream by weeks-to-months between
        # PyPI releases, so the default below points at the live
        # ``main`` branch HEAD instead.
        #
        # Default: ``main`` — clones the upstream gerrit_to_platform
        # ``main`` branch HEAD at dispatch time and installs it over
        # the container's pinned release.  This used to point at the
        # chained-tip Gerrit change ``refs/changes/75/74275/2`` (the
        # open 74275 + 74276 + 74274 fix series); that change has now
        # merged to main (see
        # https://gerrit.linuxfoundation.org/infra/c/releng/
        # gerrit_to_platform/+/74275) so ``main`` is the equivalent
        # location.  When a new PyPI release ships that includes
        # everything we depend on, this default can drop back to an
        # empty string and the container's pinned release will be
        # sufficient.
        #
        # Override at dispatch time to validate an in-flight change
        # against the test deployment before it merges (point at
        # ``refs/changes/<NN>/<num>/<ps>``), test a feature branch,
        # or pin to a specific SHA for reproducibility.  Set to an
        # empty string to use the container's pinned PyPI release
        # without any override.
        description: >-
          Git ref to install gerrit_to_platform from (branch, tag,
          SHA, or 'refs/changes/<NN>/<num>/<ps>').  Empty leaves
          the container's pinned PyPI release in place.
        required: false
        default: 'main'
        type: string
      g2p_install_repo:
        # Source repository for the g2p override install.  Default
        # points at the Linux Foundation Gerrit instance (anonymous
        # HTTPS read).  Only consulted when g2p_install_ref is set.
        description: >-
          HTTPS Git URL to fetch gerrit_to_platform from when
          g2p_install_ref is set
        required: false
        default: >-
          https://gerrit.linuxfoundation.org/infra/releng/gerrit_to_platform
        type: string
      remove_files:
        description: >-
          File patterns to remove from cloned repos
          before pushing (e.g. '.github/**')
        required: false
        default: ".github/**"
        type: string
      git_filter_projects:
        description: >-
          Project patterns for git history token replacement
          (semicolon-separated, tokens from GIT_FILTER_TOKENS)
        required: false
        default: "testsuite/pythonsdk-tests"
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Validate inputs ###
  validate:
    name: "Validate inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      persist_minutes: ${{ steps.validate.outputs.persist_minutes }}
      effective_debug: ${{ steps.validate.outputs.effective_debug }}
    steps:
      - name: "Validate persist_minutes"
        id: validate
        env:
          PERSIST_MINUTES: ${{ inputs.persist_minutes || 15 }}
          DEBUG_INPUT: ${{ inputs.debug || 'false' }}
          # RUNNER_DEBUG is set to '1' when re-running with debug logging
          RUNNER_DEBUG: ${{ runner.debug }}
          # ACTIONS_STEP_DEBUG is 'true' when step debug logging is enabled
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
        run: |
          # Validate persist_minutes input
          if ! [[ "$PERSIST_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::persist_minutes must be an integer: $PERSIST_MINUTES"
            exit 1
          fi
          if [ "$PERSIST_MINUTES" -gt 600 ]; then
            echo "::warning::persist_minutes capped" \
              "at 600 (was: $PERSIST_MINUTES)"
            PERSIST_MINUTES=600
          fi
          echo "persist_minutes=$PERSIST_MINUTES" >> "$GITHUB_OUTPUT"
          echo "Validated persist_minutes: $PERSIST_MINUTES"

          # Compute effective debug: true if input OR runner debug is enabled
          # GitHub sets RUNNER_DEBUG=1 and/or ACTIONS_STEP_DEBUG=true when
          # re-running with debug logging enabled
          if [ "$DEBUG_INPUT" = "true" ] || [ "$RUNNER_DEBUG" = "1" ] || \
             [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
            EFFECTIVE_DEBUG="true"
            if [ "$RUNNER_DEBUG" = "1" ] || \
               [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
              echo "Debug enabled via GitHub 'Re-run with debug logging'"
              echo "  RUNNER_DEBUG=$RUNNER_DEBUG"
              echo "  ACTIONS_STEP_DEBUG=$ACTIONS_STEP_DEBUG"
            else
              echo "Debug enabled via workflow input"
            fi
          else
            EFFECTIVE_DEBUG="false"
          fi
          echo "effective_debug=$EFFECTIVE_DEBUG" >> "$GITHUB_OUTPUT"
          echo "Effective debug: $EFFECTIVE_DEBUG"

  ### Extract non-sensitive matrix data ###
  prepare:
    name: "Prepare Gerrit matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      debug_matrix: ${{ steps.set-matrix.outputs.debug_matrix }}
      debug_count: ${{ steps.set-matrix.outputs.debug_count }}
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Set matrix from repository variable"
        id: set-matrix
        env:
          # GERRIT_SERVERS is a repository variable (not secret) containing:
          # [{"project":"ONAP","slug":"onap","gerrit":"gerrit.onap.org",...}]
          GERRIT_SERVERS: ${{ vars.GERRIT_SERVERS }}
          PERSIST_PROJECT_SLUGS: ${{ inputs.persist_project_slugs }}
        run: |
          # Set matrix from GERRIT_SERVERS repository variable
          if [ -z "$GERRIT_SERVERS" ]; then
            echo "::error::GERRIT_SERVERS variable is not set"
            exit 1
          fi

          # Validate JSON format
          if ! echo "$GERRIT_SERVERS" | jq empty 2>/dev/null; then
            echo "::error::GERRIT_SERVERS is not valid JSON"
            exit 1
          fi

          COUNT=$(echo "$GERRIT_SERVERS" | jq '. | length')
          echo "Full server list: $COUNT Gerrit servers"

          # Output filtered matrix for persist/debug tests
          # "none" (case-insensitive) disables persistent sessions entirely
          SLUGS_LOWER=$(echo "$PERSIST_PROJECT_SLUGS" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ "$SLUGS_LOWER" = "none" ]; then
            # Explicitly disabled — output empty matrix, no error
            DEBUG_MATRIX="[]"
            echo "Persistent sessions disabled (selector: none)"
          elif [ -z "$PERSIST_PROJECT_SLUGS" ] || \
               [ "$PERSIST_PROJECT_SLUGS" = "all" ]; then
            # Empty selector or "all" = all servers
            DEBUG_MATRIX="$MATRIX"
            echo "Debug matrix: all $COUNT servers (no selector)"
          else
            # Parse comma/space-separated selectors and support wildcards
            # Convert to newline-separated, trim whitespace
            SELECTORS=$(echo "$PERSIST_PROJECT_SLUGS" \
              | tr ',' '\n' | tr ' ' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -v '^$')

            echo "Selectors to match:"
            echo "$SELECTORS"

            # Build jq filter for each selector (wildcards supported)
            # Convert shell wildcards to regex: * -> .*, ? -> .
            DEBUG_MATRIX=$(echo "$GERRIT_SERVERS" | \
              jq -c --arg selectors "$SELECTORS" '
              ($selectors | split("\n")) as $sels |
              [.[] | . as $server |
                select(
                  any($sels[]; . as $sel |
                    if ($sel | contains("*")) or ($sel | contains("?")) then
                      # Convert glob to regex: * -> .*, ? -> .
                      ($sel | gsub("\\*"; ".*") | gsub("\\?"; ".")) as $regex |
                      ($server.slug | test("^" + $regex + "$"))
                    else
                      $server.slug == $sel
                    end
                  )
                )
              ]
            ')
            DEBUG_COUNT=$(echo "$DEBUG_MATRIX" | jq '. | length')
            if [ "$DEBUG_COUNT" -eq 0 ]; then
              echo "::error::No servers matched" \
                "selector: $PERSIST_PROJECT_SLUGS"
              echo "Available slugs:"
              echo "$GERRIT_SERVERS" | jq -r '.[].slug'
              exit 1
            fi
            echo "Debug matrix: $DEBUG_COUNT server(s) [$PERSIST_PROJECT_SLUGS]"
          fi
          echo "debug_matrix=$DEBUG_MATRIX" >> "$GITHUB_OUTPUT"
          DEBUG_COUNT=$(echo "$DEBUG_MATRIX" | jq '. | length')
          echo "debug_count=$DEBUG_COUNT" >> "$GITHUB_OUTPUT"

  ### Gerrit Deployment with Optional Tunnel Access ###
  deploy-gerrit:
    name: "Deploy: ${{ matrix.server.name }}"
    runs-on: ubuntu-latest
    needs: [validate, prepare]
    if: >-
      needs.validate.outputs.persist_minutes != '0'
      && needs.prepare.outputs.debug_count != '0'
    permissions:
      contents: read
    timeout-minutes: 605
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.debug_matrix) }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: "Parse gerrit-action ref"
        id: gerrit-action-ref
        env:
          # yamllint disable-line rule:line-length
          ACTION_REF: ${{ inputs.gerrit_action_ref || 'lfreleng-actions/gerrit-action@main' }}
        run: |
          # Parse owner/repo@branch format
          REPO="${ACTION_REF%%@*}"
          BRANCH="${ACTION_REF#*@}"
          if [ "$BRANCH" = "$ACTION_REF" ]; then
            BRANCH="main"
          fi
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Using gerrit-action: $REPO @ $BRANCH"

      - name: "Checkout gerrit-action"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: ${{ steps.gerrit-action-ref.outputs.repository }}
          ref: ${{ steps.gerrit-action-ref.outputs.ref }}
          path: .gerrit-action
          persist-credentials: false

      - name: "Lookup credentials for ${{ matrix.server.slug }}"
        id: credentials
        env:
          GERRIT_CREDENTIALS_B64: ${{ secrets.GERRIT_CREDENTIALS }}
          SERVER_SLUG: ${{ matrix.server.slug }}
        run: |
          # Lookup credentials for this server from the base64-encoded secret
          if [ -z "$GERRIT_CREDENTIALS_B64" ]; then
            echo "::error::GERRIT_CREDENTIALS secret is not set"
            exit 1
          fi

          GERRIT_CREDENTIALS=$(echo "$GERRIT_CREDENTIALS_B64" \
            | base64 -d 2>/dev/null)
          if [ -z "$GERRIT_CREDENTIALS" ]; then
            echo "::error::Failed to decode GERRIT_CREDENTIALS (invalid base64)"
            exit 1
          fi

          if ! echo "$GERRIT_CREDENTIALS" | jq empty 2>/dev/null; then
            echo "::error::Decoded GERRIT_CREDENTIALS is not valid JSON"
            exit 1
          fi

          CREDS=$(echo "$GERRIT_CREDENTIALS" | \
            jq -r --arg slug "$SERVER_SLUG" '.[] | select(.slug == $slug)')

          if [ -z "$CREDS" ]; then
            echo "::error::No credentials found for slug: $SERVER_SLUG"
            exit 1
          fi

          USERNAME=$(echo "$CREDS" | jq -r '.username')
          PASSWORD=$(echo "$CREDS" | jq -r '.password')
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      # ================================================================
      # TUNNEL SETUP (optional, before Gerrit)
      # ================================================================

      - name: "Calculate local ports"
        id: ports
        env:
          SERVER_SLUG: ${{ matrix.server.slug }}
          DEBUG_MATRIX: ${{ needs.prepare.outputs.debug_matrix }}
        run: |
          # Calculate deterministic local ports
          # These match what gerrit-action will use (BASE_PORT + index)
          BASE_HTTP_PORT=8080
          BASE_SSH_PORT=29418

          # Find index of this server in the debug matrix
          INDEX=$(echo "$DEBUG_MATRIX" | jq -r --arg slug "$SERVER_SLUG" \
            'to_entries | .[] | select(.value.slug == $slug) | .key')
          INDEX=${INDEX:-0}

          HTTP_PORT=$((BASE_HTTP_PORT + INDEX))
          SSH_PORT=$((BASE_SSH_PORT + INDEX))

          {
            echo "http_port=$HTTP_PORT"
            echo "ssh_port=$SSH_PORT"
            echo "index=$INDEX"
          } >> "$GITHUB_OUTPUT"

          echo "Local ports calculated (index $INDEX):"
          echo "  HTTP: $HTTP_PORT"
          echo "  SSH:  $SSH_PORT"

      - name: "Install bore"
        if: startsWith(inputs.remote_access, 'Bore')
        run: |
          # Install bore TCP tunnel client
          BORE_VERSION="0.5.2"
          BORE_URL="https://github.com/ekzhang/bore/releases/download"
          BORE_FILE="bore-v${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz"

          echo "Downloading bore v${BORE_VERSION}..."
          curl -sSL "${BORE_URL}/v${BORE_VERSION}/${BORE_FILE}" | tar xz

          ./bore --version
          sudo mv bore /usr/local/bin/
          echo "bore installed successfully ✅"

      - name: "Start bore tunnels"
        id: tunnels
        if: startsWith(inputs.remote_access, 'Bore')
        env:
          LOCAL_HTTP: ${{ steps.ports.outputs.http_port }}
          LOCAL_SSH: ${{ steps.ports.outputs.ssh_port }}
          SERVER_SLUG: ${{ matrix.server.slug }}
          REMOTE_ACCESS: ${{ inputs.remote_access }}
          BORE_MODESEVEN_ORG: ${{ secrets.BORE_MODESEVEN_ORG }}
        run: |
          # Resolve which bore broker to talk to and (when required)
          # the shared secret to authenticate with.  bore.pub is the
          # public relay; modeseven.org is the private AWS instance
          # with a fixed allocation port-range (40000-40100) and
          # shared-secret auth via the BORE_MODESEVEN_ORG repo secret.
          BORE_SECRET=""
          case "$REMOTE_ACCESS" in
            "Bore (bore.pub)")
              BORE_HOST="bore.pub"
              ;;
            "Bore (modeseven.org)")
              BORE_HOST="modeseven.org"
              BORE_SECRET="$BORE_MODESEVEN_ORG"
              if [ -z "$BORE_SECRET" ]; then
                echo "::error::BORE_MODESEVEN_ORG repo secret is not" \
                  "set; cannot authenticate against the private bore" \
                  "broker at modeseven.org"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unrecognised Bore variant:" \
                "'$REMOTE_ACCESS'"
              exit 1
              ;;
          esac

          # Regex-escape '.' in the host name for the log-line grep
          # later (the only regex metacharacter present in either
          # broker name).
          BORE_HOST_RE=$(printf '%s' "$BORE_HOST" | sed 's/[.]/\\./g')

          # Bore client invocations: pass --secret only when set so
          # the public bore.pub path stays argv-identical to before.
          BORE_ARGS=(--to "$BORE_HOST")
          if [ -n "$BORE_SECRET" ]; then
            BORE_ARGS+=(--secret "$BORE_SECRET")
          fi

          echo "Starting bore tunnels to ${BORE_HOST}..."

          # Start bore tunnels BEFORE Gerrit container
          # Start HTTP tunnel
          bore local "$LOCAL_HTTP" "${BORE_ARGS[@]}" \
            > bore-http.log 2>&1 &
          HTTP_PID=$!

          # Start SSH tunnel
          bore local "$LOCAL_SSH" "${BORE_ARGS[@]}" \
            > bore-ssh.log 2>&1 &
          SSH_PID=$!

          {
            echo "http_pid=$HTTP_PID"
            echo "ssh_pid=$SSH_PID"
            echo "local_http_port=$LOCAL_HTTP"
            echo "local_ssh_port=$LOCAL_SSH"
          } >> "$GITHUB_OUTPUT"

          # Wait for tunnels to establish
          echo "Waiting for tunnels to establish..."
          MAX_WAIT=30
          WAIT_INTERVAL=2
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))

            HTTP_RUNNING=true
            SSH_RUNNING=true
            if ! kill -0 "$HTTP_PID" 2>/dev/null; then
              HTTP_RUNNING=false
            fi
            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              SSH_RUNNING=false
            fi

            HTTP_PORT=$(grep -oP \
              "listening at ${BORE_HOST_RE}:\K\d+" \
              bore-http.log 2>/dev/null || echo "")
            SSH_PORT=$(grep -oP \
              "listening at ${BORE_HOST_RE}:\K\d+" \
              bore-ssh.log 2>/dev/null || echo "")

            if [ -n "$HTTP_PORT" ] && [ -n "$SSH_PORT" ]; then
              echo "Tunnels established after ${ELAPSED}s"
              break
            fi

            if [ "$HTTP_RUNNING" = "false" ] && [ -z "$HTTP_PORT" ]; then
              echo "HTTP tunnel process exited unexpectedly"
              break
            fi
            if [ "$SSH_RUNNING" = "false" ] && [ -z "$SSH_PORT" ]; then
              echo "SSH tunnel process exited unexpectedly"
              break
            fi

            echo "  Waiting... (${ELAPSED}s/${MAX_WAIT}s)"
          done

          # Final port extraction
          HTTP_PORT=$(grep -oP \
            "listening at ${BORE_HOST_RE}:\K\d+" \
            bore-http.log 2>/dev/null || echo "")
          SSH_PORT=$(grep -oP \
            "listening at ${BORE_HOST_RE}:\K\d+" \
            bore-ssh.log 2>/dev/null || echo "")

          if [ -n "$HTTP_PORT" ] && [ -n "$SSH_PORT" ]; then
            # Use -c for compact JSON to avoid multi-line output issues
            TUNNEL_PORTS=$(jq -c -n \
              --arg slug "$SERVER_SLUG" \
              --argjson http "$HTTP_PORT" \
              --argjson ssh "$SSH_PORT" \
              '{($slug): {http: $http, ssh: $ssh}}')

            {
              echo "tunnels_ok=true"
              echo "bore_host=$BORE_HOST"
              echo "http_port=$HTTP_PORT"
              echo "ssh_port=$SSH_PORT"
              echo "tunnel_ports=$TUNNEL_PORTS"
            } >> "$GITHUB_OUTPUT"

            echo "Bore tunnels established successfully ✅"
            echo "  HTTP: ${BORE_HOST}:$HTTP_PORT -> localhost:$LOCAL_HTTP"
            echo "  SSH:  ${BORE_HOST}:$SSH_PORT -> localhost:$LOCAL_SSH"
          else
            HTTP_ERR=$(head -1 bore-http.log 2>/dev/null || echo "unknown")
            SSH_ERR=$(head -1 bore-ssh.log 2>/dev/null || echo "unknown")

            echo ""
            echo "❌ Bore tunnel setup failed"
            if [ "$HTTP_ERR" = "$SSH_ERR" ]; then
              echo "  Error: $HTTP_ERR"
            else
              [ -z "$HTTP_PORT" ] && echo "  HTTP: $HTTP_ERR"
              [ -z "$SSH_PORT" ] && echo "  SSH: $SSH_ERR"
            fi

            {
              echo "## ❌ Bore Tunnel Setup Failed"
              echo ""
              if [ "$HTTP_ERR" = "$SSH_ERR" ]; then
                echo "$HTTP_ERR"
              else
                [ -z "$HTTP_PORT" ] && echo "- **HTTP:** $HTTP_ERR"
                [ -z "$SSH_PORT" ] && echo "- **SSH:** $SSH_ERR"
              fi
              echo ""
              echo "${BORE_HOST} may be down, or port 7835 is blocked."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Bore tunnel setup failed. Check job summary."
            exit 1
          fi

      # ================================================================
      # TAILSCALE SETUP (optional, before Gerrit)
      # ================================================================

      - name: "Connect to Tailscale"
        id: tailscale
        if: inputs.remote_access == 'Tailscale'
        # yamllint disable-line rule:line-length
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gerrit-ci-${{ matrix.server.slug }}

      - name: "Configure Tailscale tunnels"
        id: tailscale-tunnel
        if: inputs.remote_access == 'Tailscale'
        env:
          LOCAL_HTTP: ${{ steps.ports.outputs.http_port }}
          LOCAL_SSH: ${{ steps.ports.outputs.ssh_port }}
          SERVER_SLUG: ${{ matrix.server.slug }}
        run: |
          # Get Tailscale IP and configure tunnel info
          TAILSCALE_IP=$(tailscale ip -4)
          echo "Tailscale IP: $TAILSCALE_IP"

          HTTP_PORT="${LOCAL_HTTP}"
          SSH_PORT="${LOCAL_SSH}"

          # Build tunnel_ports JSON matching gerrit-action format
          TUNNEL_PORTS=$(jq -c -n \
            --arg slug "$SERVER_SLUG" \
            --argjson http "$HTTP_PORT" \
            --argjson ssh "$SSH_PORT" \
            '{($slug): {http: $http, ssh: $ssh}}')

          {
            echo "tailscale_ip=$TAILSCALE_IP"
            echo "http_port=$HTTP_PORT"
            echo "ssh_port=$SSH_PORT"
            echo "local_http_port=$LOCAL_HTTP"
            echo "local_ssh_port=$LOCAL_SSH"
            echo "tunnel_ports=$TUNNEL_PORTS"
          } >> "$GITHUB_OUTPUT"

          echo "Tailscale tunnel configured ✅"
          echo "  HTTP: $TAILSCALE_IP:$HTTP_PORT"
          echo "  SSH:  $TAILSCALE_IP:$SSH_PORT"

      # ================================================================
      # START GERRIT
      # ================================================================

      - name: "Start Gerrit mirror: ${{ matrix.server.name }}"
        id: gerrit
        # Ref controlled by gerrit_action_ref input; defaults to
        # upstream main when unset (see checkout step above)
        uses: ./.gerrit-action
        with:
          gerrit_setup: |
            [{
              "project": "${{ matrix.server.project_filter || '' }}",
              "slug": "${{ matrix.server.slug }}",
              "gerrit": "${{ matrix.server.gerrit }}",
              "api_path": "${{ matrix.server.api_path }}"
            }]
          auth_type: http_basic
          http_username: ${{ steps.credentials.outputs.username }}
          http_password: ${{ steps.credentials.outputs.password }}
          ssh_auth_keys: ${{ vars.GERRIT_PUBLIC_KEYS }}
          ssh_auth_username: 'modesevenindustrialsolutions'
          sync_on_startup: ${{ inputs.sync_on_startup }}
          skip_archived_projects: >-
            ${{ inputs.skip_archived_projects == true && 'true' || 'false' }}
          replicate_meta_refs: >-
            ${{ inputs.replicate_open_changes == true && 'true' || 'false' }}
          reindex_after_sync: >-
            ${{ inputs.replicate_open_changes == true && 'true' || 'false' }}
          use_api_path: ${{ inputs.match_api_path }}
          debug: ${{ needs.validate.outputs.effective_debug }}
          check_service: true
          exit: false
          tunnel_host: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.bore_host ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tailscale_ip ||
              ''
            }}
          tunnel_ports: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.tunnel_ports ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tunnel_ports ||
              ''
            }}
          # G2P (gerrit_to_platform) integration
          # Target org comes from the per-server github_gerrit_org field so
          # slugs that differ from the org suffix resolve correctly (e.g.
          # slug "oran" -> org "modeseven-gerrit-o-ran-sc"). The field is
          # optional in GERRIT_SERVERS; when absent/empty we fall back to
          # the slug-derived "modeseven-gerrit-<slug>" form.
          g2p_enable: >-
            ${{ inputs.configure_g2p == true && 'true' || 'false' }}
          g2p_github_token: >-
            ${{
              inputs.configure_g2p == true &&
                secrets.G2P_GITHUB_TOKEN || ''
            }}
          g2p_github_owner: >-
            ${{
              matrix.server.github_gerrit_org ||
                format('modeseven-gerrit-{0}', matrix.server.slug)
            }}
          g2p_remote_name_style: 'dash'
          g2p_validation_mode: 'warn'
          g2p_org_setup: ${{ inputs.g2p_org_setup }}
          # Base64-encoded JSON array of {github_org, token} entries.
          # gerrit-action base64-decodes and parses this internally
          # (see scripts/lib/g2p_config.py::decode_org_tokens).
          g2p_org_token_map: >-
            ${{
              inputs.g2p_org_setup == 'provision' &&
                secrets.ORG_TOKEN_JSON || ''
            }}

      # ================================================================
      # OPTIONAL: PATCH gerrit_to_platform FROM A GIT REF
      # ================================================================
      # Activated only when 'g2p_install_ref' is non-empty.  Clones the
      # gerrit_to_platform repository on the runner, checks out the
      # requested ref (branch, tag, SHA or Gerrit change refspec such
      # as 'refs/changes/75/74275/2'), copies the working tree into
      # every running container and re-installs the package over the
      # pinned release inside '/opt/gerrit-tools'.
      #
      # The container's baseline pinned release (see
      # gerrit-action/docker/requirements.txt) is preserved when this
      # input is left at its empty default; reverting the override is
      # simply a matter of clearing the workflow input or removing
      # this step.  We use '--no-deps' because the framework is
      # standard-library only — no transitive deps need to change.
      - name: "Patch gerrit_to_platform from git ref"
        id: patch-g2p
        if: >-
          inputs.configure_g2p == true &&
          inputs.g2p_install_ref != '' &&
          steps.gerrit.outputs.container_ids != ''
        shell: bash
        env:
          G2P_INSTALL_REF: ${{ inputs.g2p_install_ref }}
          G2P_INSTALL_REPO: ${{ inputs.g2p_install_repo }}
          CONTAINER_IDS: ${{ steps.gerrit.outputs.container_ids }}
          DEBUG: ${{ needs.validate.outputs.effective_debug }}
        run: |
          set -euo pipefail

          if [ "${DEBUG:-false}" = "true" ]; then
            set -x
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to parse container_ids" >&2
            exit 1
          fi

          echo "::group::Patch gerrit_to_platform from" \
            "${G2P_INSTALL_REPO}@${G2P_INSTALL_REF}"

          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          # Shallow clone keeps the runner footprint small; the
          # subsequent fetch handles arbitrary refs (including
          # Gerrit change refspecs that the initial clone does not
          # advertise).
          echo "Cloning ${G2P_INSTALL_REPO}"
          # '--' guards against an input that begins with '-' being
          # interpreted as a git option (option-injection hardening).
          git clone --depth=1 --no-tags -- \
            "${G2P_INSTALL_REPO}" "${WORKDIR}/g2p"

          echo "Fetching ref: ${G2P_INSTALL_REF}"
          git -C "${WORKDIR}/g2p" fetch --depth=1 origin \
            -- "${G2P_INSTALL_REF}"
          git -C "${WORKDIR}/g2p" checkout --detach FETCH_HEAD

          RESOLVED_SHA=$(git -C "${WORKDIR}/g2p" rev-parse HEAD)
          echo "Resolved ${G2P_INSTALL_REF} -> ${RESOLVED_SHA}"
          echo "resolved_sha=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"

          # CONTAINER_IDS may be either a JSON array (gerrit-action
          # contract) or a single id (defensive fallback).
          if echo "${CONTAINER_IDS}" | \
            jq -e 'type == "array"' >/dev/null 2>&1; then
              mapfile -t CIDS < <(echo "${CONTAINER_IDS}" | jq -r '.[]')
          else
              CIDS=("${CONTAINER_IDS}")
          fi

          for CID in "${CIDS[@]}"; do
            [ -z "${CID}" ] && continue
            echo "--- Patching container ${CID} ---"

            # Capture the baseline version so we can prove the
            # override took effect.
            BEFORE=$(docker exec --user root "${CID}" \
              /opt/gerrit-tools/bin/python -c \
                'import gerrit_to_platform as g; print(g.__version__)' \
              2>/dev/null || echo 'unknown')
            echo "  baseline gerrit_to_platform version: ${BEFORE}"

            # Drop the working tree into the container and install
            # over the existing venv.  '--no-deps' avoids touching
            # the hash-pinned transitive dependencies.  'uv' itself
            # lives at /usr/local/bin/uv (see gerrit-action's
            # Dockerfile); /opt/gerrit-tools is the venv it manages.
            #
            # 'docker cp' preserves the runner's UID/GID on the
            # copied tree, which clashes with 'docker exec --user
            # root' below: setuptools_scm's git introspection then
            # trips over Git's 'dubious ownership' safety check.
            # 'chown' brings the staged tree under root so the
            # build runs cleanly.  We also pin the package version
            # via SETUPTOOLS_SCM_PRETEND_VERSION_FOR_<DIST_NAME> to
            # bypass git introspection entirely (the shallow clone
            # cannot derive a meaningful version anyway).
            docker exec --user root "${CID}" rm -rf /tmp/g2p-override
            docker cp "${WORKDIR}/g2p" "${CID}:/tmp/g2p-override"
            docker exec --user root "${CID}" \
              chown -R root:root /tmp/g2p-override

            PRETEND_VERSION="0+gerrit.${RESOLVED_SHA:0:7}"
            SCM_VAR=SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GERRIT_TO_PLATFORM
            docker exec --user root \
              -e "${SCM_VAR}=${PRETEND_VERSION}" \
              "${CID}" \
              /usr/local/bin/uv pip install \
                --python /opt/gerrit-tools/bin/python \
                --upgrade --force-reinstall --no-deps \
                /tmp/g2p-override

            AFTER=$(docker exec --user root "${CID}" \
              /opt/gerrit-tools/bin/python -c \
                'import gerrit_to_platform as g; print(g.__version__)' \
              2>/dev/null || echo 'unknown')
            echo "  override gerrit_to_platform version: ${AFTER}"

            # Verify the console scripts still resolve after the swap.
            docker exec --user root "${CID}" \
              /opt/gerrit-tools/bin/change-merged --help >/dev/null

            # Tidy up the staging copy inside the container.
            docker exec --user root "${CID}" rm -rf /tmp/g2p-override
          done

          echo "::endgroup::"
          # GitHub Actions notice annotation; long ref/SHA pulled into
          # variables so the workflow stays inside yamllint's 80-col limit.
          NOTICE_TITLE="g2p override"
          NOTICE_BODY="Installed gerrit_to_platform from"
          NOTICE_BODY="${NOTICE_BODY} ${G2P_INSTALL_REPO}@${G2P_INSTALL_REF}"
          NOTICE_BODY="${NOTICE_BODY} (${RESOLVED_SHA}) in"
          NOTICE_BODY="${NOTICE_BODY} ${#CIDS[@]} container(s)"
          echo "::notice title=${NOTICE_TITLE}::${NOTICE_BODY}"

      - name: "Verify tunnel connectivity"
        if: inputs.remote_access != 'None'
        shell: bash
        env:
          TUNNEL_HOST: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.bore_host ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tailscale_ip ||
              ''
            }}
          HTTP_PORT: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.http_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.http_port ||
              ''
            }}
          API_PATH: ${{ matrix.server.api_path }}
          MATCH_API_PATH: ${{ inputs.match_api_path }}
          DEBUG: ${{ needs.validate.outputs.effective_debug }}
          MAX_ATTEMPTS: "5"
          RETRY_DELAY: "3"
        run: |
          # Verify the tunnel is working by hitting Gerrit through it
          echo "Verifying tunnel connectivity..."

          EFFECTIVE_API_PATH=""
          if [ "${MATCH_API_PATH:-false}" = "true" ] && [ -n "$API_PATH" ]; then
            EFFECTIVE_API_PATH="$API_PATH"
          fi

          if [ -n "$EFFECTIVE_API_PATH" ]; then
            URL="http://${TUNNEL_HOST}:${HTTP_PORT}${EFFECTIVE_API_PATH}/config/server/version"
          else
            URL="http://${TUNNEL_HOST}:${HTTP_PORT}/config/server/version"
          fi

          echo "Testing: $URL"

          MAX_ATTEMPTS=5
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if echo "$HTTP_CODE" | grep -q "200"; then
              VERSION=$(curl -s "$URL" | tr -d '")' | tail -1)
              echo "Tunnel verified ✅ (Gerrit $VERSION)"
              exit 0
            fi
            echo "  Attempt $i/$MAX_ATTEMPTS failed, retrying..."
            sleep 3
          done

          echo "::warning::Could not verify tunnel connectivity"
          echo "Gerrit may still be starting up"

      - name: "Stage gitreview_tool.py inside Gerrit containers"
        # Ship the Python helper that consolidates all .gitreview
        # create/rewrite logic (see scripts/gitreview_tool.py).  The
        # tool runs inside each Gerrit container as the 'gerrit'
        # user so any new git objects/refs land with the correct
        # ownership and replication/GC keeps working.
        if: >-
          inputs.create_missing_gitreview == true ||
          inputs.rewrite_gitreview != 'Leave unchanged'
        env:
          CONTAINER_IDS: ${{ steps.gerrit.outputs.container_ids }}
        shell: bash
        run: |
          # Copy the tool into every Gerrit container under /tmp/.
          set -eu
          if [ -z "${CONTAINER_IDS}" ]; then
            echo "::warning::Empty container_ids from gerrit step" \
              "(no containers running);" \
              "skipping gitreview tool staging"
            exit 0
          fi
          # jq is a hard dependency of CONTAINER_IDS parsing in
          # this step and the two that follow.  Fail loudly here
          # so a missing jq surfaces in a single place rather
          # than producing inconsistent behaviour downstream.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to parse container_ids"
            exit 1
          fi
          if echo "${CONTAINER_IDS}" | \
            jq -e 'type == "array"' >/dev/null 2>&1; then
              mapfile -t CIDS < <(echo "${CONTAINER_IDS}" | jq -r '.[]')
          else
              CIDS=("${CONTAINER_IDS}")
          fi
          for CID in "${CIDS[@]}"; do
            [ -z "${CID}" ] && continue
            SHORT="${CID:0:12}"
            echo "--- staging gitreview_tool.py inside ${SHORT} ---"
            docker cp scripts/gitreview_tool.py \
              "${CID}:/tmp/gitreview_tool.py"
            # 'docker cp' lands the file as root:root.  Chown to
            # gerrit so the follow-up 'docker exec --user gerrit'
            # can read it without re-invoking root.
            docker exec --user root "${CID}" \
              chown gerrit:gerrit /tmp/gitreview_tool.py
          done

      - name: "Create missing .gitreview files"
        # Synthesise .gitreview on every default-branch tip that
        # lacks one, sourcing host/port from the first usable
        # .gitreview elsewhere in the estate.  Honours the same
        # commit strategy as 'rewrite_gitreview' so 'create +
        # amend + rewrite' together leave no synthetic 'Chore'
        # commit in the resulting branch history.  Full
        # implementation lives in scripts/gitreview_tool.py.
        if: inputs.create_missing_gitreview == true
        env:
          CONTAINER_IDS: ${{ steps.gerrit.outputs.container_ids }}
          REWRITE_MODE: ${{ inputs.rewrite_gitreview }}
        shell: bash
        run: |
          # Invoke gitreview_tool.py create-missing in every container.
          set -eu
          if [ -z "${CONTAINER_IDS}" ]; then
            echo "::warning::Empty container_ids from gerrit step" \
              "(no containers running);" \
              "skipping .gitreview create"
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to parse container_ids"
            exit 1
          fi
          STRATEGY=new
          if [ "${REWRITE_MODE}" = "Change by amended commit" ]; then
            STRATEGY=amend
          fi
          if echo "${CONTAINER_IDS}" | \
            jq -e 'type == "array"' >/dev/null 2>&1; then
              mapfile -t CIDS < <(echo "${CONTAINER_IDS}" | jq -r '.[]')
          else
              CIDS=("${CONTAINER_IDS}")
          fi
          for CID in "${CIDS[@]}"; do
            [ -z "${CID}" ] && continue
            SHORT="${CID:0:12}"
            echo "--- creating missing .gitreview inside ${SHORT} ---"
            docker exec --user gerrit "${CID}" \
              python3 /tmp/gitreview_tool.py create-missing \
                --strategy "${STRATEGY}"
          done

      - name: "Update .gitreview across replicated repos"
        # Rewrite .gitreview in every replicated project so clones
        # from the test Gerrit target the test instance rather
        # than the upstream production Gerrit it mirrors.  For
        # 'None' (no VPN) the runner's public IPv4 is used (resolved
        # via 'curl -4' against external echo services so no RFC1918
        # interface address can ever leak into .gitreview).
        # Tailscale leaves the port line alone (the tunnel exposes
        # the container's native SSH port directly).  Full
        # implementation lives in scripts/gitreview_tool.py.
        #
        # Two commit strategies via 'rewrite_gitreview':
        #   * 'Change with new commit'   - append a synthetic
        #                                  'Chore: Rewrite
        #                                  .gitreview' commit on
        #                                  top of each tip.
        #   * 'Change by amended commit' - rebuild the existing
        #                                  tip in place; nothing
        #                                  about the rewrite
        #                                  appears in 'git log'.
        if: inputs.rewrite_gitreview != 'Leave unchanged'
        env:
          CONTAINER_IDS: ${{ steps.gerrit.outputs.container_ids }}
          REMOTE_ACCESS: ${{ inputs.remote_access }}
          REWRITE_MODE: ${{ inputs.rewrite_gitreview }}
          TUNNEL_HOST: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.bore_host ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tailscale_ip ||
              ''
            }}
          TUNNEL_SSH_PORT: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.ssh_port ||
              ''
            }}
          LOCAL_SSH_PORT: ${{ steps.ports.outputs.ssh_port }}
        shell: bash
        run: |
          # Resolve target host/port, then invoke gitreview_tool.py
          # rewrite in every container.
          set -eu

          if [ -z "${CONTAINER_IDS}" ]; then
            echo "::warning::Empty container_ids from gerrit step" \
              "(no containers running);" \
              "skipping .gitreview rewrite"
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to parse container_ids"
            exit 1
          fi

          NEW_HOST=""
          NEW_PORT=""
          KEEP_PORT_FLAG=""
          case "${REMOTE_ACCESS}" in
            "Bore "*)
              NEW_HOST="${TUNNEL_HOST}"
              NEW_PORT="${TUNNEL_SSH_PORT}"
              ;;
            "Tailscale")
              NEW_HOST="${TUNNEL_HOST}"
              KEEP_PORT_FLAG="--keep-port"
              ;;
            "None")
              # Force IPv4 via 'curl -4' so dual-stack runners
              # cannot return an IPv6 literal.  No local-interface
              # fallback: 'ip route get' would return a RFC1918
              # address behind GitHub's NAT and silently break
              # 'git review' for any external client.  When both
              # external probes fail the empty-host guard below
              # skips the step with a clear warning.
              NEW_HOST="$(curl -4 -fsS --max-time 5 \
                https://api.ipify.org 2>/dev/null || true)"
              if [ -z "${NEW_HOST}" ]; then
                NEW_HOST="$(curl -4 -fsS --max-time 5 \
                  https://ifconfig.me 2>/dev/null || true)"
              fi
              NEW_PORT="${LOCAL_SSH_PORT}"
              ;;
          esac

          if [ -z "${NEW_HOST}" ]; then
            echo "::warning::Empty target host" \
              "(remote_access=${REMOTE_ACCESS});" \
              "skipping .gitreview rewrite"
            exit 0
          fi
          if [ -z "${KEEP_PORT_FLAG}" ] && [ -z "${NEW_PORT}" ]; then
            echo "::warning::Empty target SSH port under" \
              "remote_access=${REMOTE_ACCESS}" \
              "(tunnel may not be established);" \
              "skipping .gitreview rewrite"
            exit 0
          fi
          echo "target host=${NEW_HOST}" \
            "port=${NEW_PORT:-<unchanged>}"

          STRATEGY=new
          if [ "${REWRITE_MODE}" = "Change by amended commit" ]; then
            STRATEGY=amend
          fi

          if echo "${CONTAINER_IDS}" | \
            jq -e 'type == "array"' >/dev/null 2>&1; then
              mapfile -t CIDS < <(echo "${CONTAINER_IDS}" | jq -r '.[]')
          else
              CIDS=("${CONTAINER_IDS}")
          fi

          # Assemble tool argv.  '--keep-port' and '--port' are
          # mutually exclusive on the tool side.
          ARGS=(rewrite --host "${NEW_HOST}" --strategy "${STRATEGY}")
          if [ -n "${KEEP_PORT_FLAG}" ]; then
            ARGS+=("${KEEP_PORT_FLAG}")
          else
            ARGS+=(--port "${NEW_PORT}")
          fi

          for CID in "${CIDS[@]}"; do
            [ -z "${CID}" ] && continue
            SHORT="${CID:0:12}"
            echo "--- rewriting .gitreview inside ${SHORT} ---"
            docker exec --user gerrit "${CID}" \
              python3 /tmp/gitreview_tool.py "${ARGS[@]}"
          done

      - name: "Display connection info"
        env:
          REMOTE_ACCESS: ${{ inputs.remote_access }}
          TUNNEL_HOST: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.bore_host ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.tailscale_ip ||
              ''
            }}
          TUNNEL_HTTP_PORT: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.http_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.http_port ||
              ''
            }}
          TUNNEL_SSH_PORT: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.ssh_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.ssh_port ||
              ''
            }}
          TUNNEL_LOCAL_HTTP: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.local_http_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.local_http_port ||
              ''
            }}
          TUNNEL_LOCAL_SSH: >-
            ${{
              startsWith(inputs.remote_access, 'Bore') &&
                steps.tunnels.outputs.local_ssh_port ||
              inputs.remote_access == 'Tailscale' &&
                steps.tailscale-tunnel.outputs.local_ssh_port ||
              ''
            }}
          PERSIST_MINUTES: ${{ needs.validate.outputs.persist_minutes }}
          SERVER_NAME: ${{ matrix.server.name }}
          API_PATH: ${{ matrix.server.api_path }}
          SERVER_SLUG: ${{ matrix.server.slug }}
          MATCH_API_PATH: ${{ inputs.match_api_path }}
          G2P_ENABLED: ${{ steps.gerrit.outputs.g2p_enabled }}
          G2P_GITHUB_OWNER: ${{ steps.gerrit.outputs.g2p_github_owner }}
          G2P_HOOKS_ENABLED: ${{ steps.gerrit.outputs.g2p_hooks_enabled }}
          G2P_TOKEN_PROVIDED: ${{ steps.gerrit.outputs.g2p_token_provided }}
          LOCAL_HTTP_PORT: ${{ steps.ports.outputs.http_port }}
          LOCAL_SSH_PORT: ${{ steps.ports.outputs.ssh_port }}
        run: |
          # Display connection information
          if [ "$REMOTE_ACCESS" != "None" ] && [ -n "$TUNNEL_HOST" ]; then
            REMOTE_HOST="$TUNNEL_HOST"
            HTTP_PORT="$TUNNEL_HTTP_PORT"
            SSH_PORT="$TUNNEL_SSH_PORT"
            LOCAL_HTTP="$TUNNEL_LOCAL_HTTP"
            LOCAL_SSH="$TUNNEL_LOCAL_SSH"
          else
            # 'None' mode: use the deterministic local ports
            # assigned to this matrix entry by the 'Calculate
            # local ports' step (BASE + index).  Falling back to
            # the hard-coded BASE values would diverge from what
            # Gerrit actually bound for matrix entries beyond
            # index 0 and would not match the port written into
            # .gitreview by the rewrite step.
            REMOTE_HOST="localhost"
            HTTP_PORT="${LOCAL_HTTP_PORT:-8080}"
            SSH_PORT="${LOCAL_SSH_PORT:-29418}"
            LOCAL_HTTP="${LOCAL_HTTP_PORT:-8080}"
            LOCAL_SSH="${LOCAL_SSH_PORT:-29418}"
          fi

          declare -a TUNNELS=()

          EFFECTIVE_API_PATH=""
          if [ "${MATCH_API_PATH:-false}" = "true" ] && [ -n "$API_PATH" ]; then
            EFFECTIVE_API_PATH="$API_PATH"
          fi

          if [ -n "$HTTP_PORT" ]; then
            if [ -n "$EFFECTIVE_API_PATH" ]; then
              HTTP_URL="http://${REMOTE_HOST}:${HTTP_PORT}${EFFECTIVE_API_PATH}/"
            else
              HTTP_URL="http://${REMOTE_HOST}:${HTTP_PORT}/"
            fi
            TUNNELS+=("http|Web UI|$LOCAL_HTTP|$HTTP_PORT|$HTTP_URL")
          fi
          if [ -n "$SSH_PORT" ]; then
            SSH_URL="ssh://admin@${REMOTE_HOST}:${SSH_PORT}"
            TUNNELS+=("ssh|SSH/Git|$LOCAL_SSH|$SSH_PORT|$SSH_URL")
          fi

          {
            echo "# 🖥️ Gerrit Server Online: $SERVER_NAME"
            echo ""
            echo "## 🌐 Public Access Ports"
            echo ""
            echo "| Service | Local Port | Public Port | Public URL |"
            echo "|---------|------------|-------------|------------|"

            for t in "${TUNNELS[@]}"; do
              IFS='|' read -r _ LABEL LOCAL PUBLIC URL <<< "$t"
              echo "| **$LABEL** | $LOCAL | $PUBLIC | \`$URL\` |"
            done

            echo ""
            echo "## 🔗 Quick Access"
            echo ""

            if [ -n "$HTTP_PORT" ]; then
              echo "### Gerrit Web Portal"
              echo ""
              if [ -n "$EFFECTIVE_API_PATH" ]; then
                echo "**URL**:" \
                  "http://$REMOTE_HOST:$HTTP_PORT$EFFECTIVE_API_PATH/"
              else
                echo "**URL**: http://$REMOTE_HOST:$HTTP_PORT/"
              fi
              echo ""
              echo '```bash'
              echo "# Check version"
              if [ -n "$EFFECTIVE_API_PATH" ]; then
                URL="http://$REMOTE_HOST:$HTTP_PORT$EFFECTIVE_API_PATH"
              else
                URL="http://$REMOTE_HOST:$HTTP_PORT"
              fi
              echo "curl -s $URL/config/server/version"
              echo ""
              echo "# List projects"
              echo "curl -s $URL/projects/"
              echo '```'
              echo ""
            fi

            if [ -n "$SSH_PORT" ]; then
              echo "### SSH Access"
              echo ""
              echo '```bash'
              echo "# Test connection"
              echo "ssh -p $SSH_PORT admin@$REMOTE_HOST gerrit version"
              echo ""
              echo "# Clone a repository"
              echo "git clone ssh://admin@$REMOTE_HOST:$SSH_PORT/PROJECT_NAME"
              echo '```'
              echo ""
            fi

            echo "## ⏱️ Session Info"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Server | $SERVER_NAME (\`$SERVER_SLUG\`) |"
            echo "| Duration | $PERSIST_MINUTES minutes |"
            DATE_FMT='+%Y-%m-%d %H:%M:%S %Z'
            EXPIRY=$(date -d "+$PERSIST_MINUTES minutes" "$DATE_FMT" \
              2>/dev/null || date -v+"${PERSIST_MINUTES}"M "$DATE_FMT")
            echo "| Expires | $EXPIRY |"
            echo ""
            if [ "${G2P_ENABLED:-false}" = "true" ]; then
              echo "## 🔄 Gerrit to Platform (G2P)"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Target Org | \`$G2P_GITHUB_OWNER\` |"
              echo "| Token | ${G2P_TOKEN_PROVIDED:-false} |"
              echo "| Hooks | $G2P_HOOKS_ENABLED |"
              echo ""
            fi
            if [ "$REMOTE_ACCESS" != "None" ]; then
              echo "> ⚠️ **Warning**: URLs are publicly accessible!"
            else
              echo "ℹ️ **Note**: Local access only (remote access disabled)"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "========================================"
          echo "  GERRIT SERVER ONLINE"
          echo "========================================"
          for t in "${TUNNELS[@]}"; do
            IFS='|' read -r _ LABEL _ _ URL <<< "$t"
            printf "  %-10s %s\n" "$LABEL:" "$URL"
          done
          echo "  Duration:  $PERSIST_MINUTES minutes"
          echo "========================================"
          echo ""

      - name: "Keep session alive"
        env:
          PERSIST_MINUTES: ${{ needs.validate.outputs.persist_minutes }}
          REMOTE_ACCESS: ${{ inputs.remote_access }}
        run: |
          # Keep the session alive for the specified duration
          echo "Session will remain active for $PERSIST_MINUTES minutes..."
          echo "Cancel the workflow manually when you're done."
          echo ""

          TOTAL_SECONDS=$((PERSIST_MINUTES * 60))
          ELAPSED=0
          INTERVAL=60

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            echo "[$(date '+%H:%M:%S')] $REMAINING minutes remaining..."

            if [ "$REMOTE_ACCESS" = "Bore" ]; then
              if ! pgrep -f "bore local" > /dev/null; then
                echo "::warning::bore tunnels have stopped unexpectedly"
                echo "HTTP tunnel log:"
                cat bore-http.log 2>/dev/null || echo "(no log)"
                echo "SSH tunnel log:"
                cat bore-ssh.log 2>/dev/null || echo "(no log)"
              fi
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Session time expired."

      # ================================================================
      # CAPTURE G2P DIAGNOSTICS BEFORE CLEANUP
      # ================================================================
      # The Gerrit container is the only place that holds the
      # gerrit_to_platform hook output (stderr → error_log via the
      # Gerrit hooks plugin) and the gerrit-action wrapper's
      # per-event tee log (g2p-hooks.log).  Both vanish the moment
      # we kill the container, so collect them here while it is
      # still running, then attach them to the workflow run as a
      # downloadable artefact.  The step (and its companion upload)
      # is gated on inputs.configure_g2p == true, so opt-out runs
      # skip both steps entirely — no artefact is produced and no
      # warning is emitted.
      - name: "Capture g2p diagnostics"
        id: capture-g2p
        if: >-
          always() &&
          inputs.configure_g2p == true &&
          steps.gerrit.outputs.container_ids != ''
        shell: bash
        env:
          CONTAINER_IDS: ${{ steps.gerrit.outputs.container_ids }}
          SERVER_SLUG: ${{ matrix.server.slug }}
        run: |
          set +e  # never let diagnostic capture mask the real result
          mkdir -p g2p-diagnostics

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq missing; skipping diagnostics capture" >&2
            exit 0
          fi

          if echo "${CONTAINER_IDS}" | \
            jq -e 'type == "array"' >/dev/null 2>&1; then
              mapfile -t CIDS < <(echo "${CONTAINER_IDS}" | jq -r '.[]')
          else
              CIDS=("${CONTAINER_IDS}")
          fi

          for CID in "${CIDS[@]}"; do
            [ -z "${CID}" ] && continue
            SHORT="${CID:0:12}"
            DEST="g2p-diagnostics/${SERVER_SLUG}-${SHORT}"
            mkdir -p "${DEST}"
            echo "Collecting diagnostics from ${CID} -> ${DEST}"

            # Installed package version (proves whether the
            # override took effect: 0+gerrit.<sha> vs 0.3.1).
            docker exec --user root "${CID}" \
              /opt/gerrit-tools/bin/python -c \
              'import gerrit_to_platform as g; print(g.__version__)' \
              > "${DEST}/g2p-version.txt" 2>&1

            # The wrapper's per-hook tee (entry, argv, exit code,
            # raw stdout/stderr).
            docker cp "${CID}:/var/gerrit/logs/g2p-hooks.log" \
              "${DEST}/g2p-hooks.log" 2>/dev/null

            # Gerrit's main error_log carries the structured trace
            # the new logging framework writes to stderr.
            docker cp "${CID}:/var/gerrit/logs/error_log" \
              "${DEST}/error_log" 2>/dev/null

            # SSHD log (helps diagnose hook-trigger paths involving
            # SSH replication or pull-replication).
            docker cp "${CID}:/var/gerrit/logs/sshd_log" \
              "${DEST}/sshd_log" 2>/dev/null

            # Replication log captures the replication plugin's
            # view of the same merge events.
            docker cp "${CID}:/var/gerrit/logs/replication_log" \
              "${DEST}/replication_log" 2>/dev/null

            # Snapshot the g2p config (token already redacted by
            # the wrapper before it was written; double-check via
            # the framework's RedactingFilter on read-back if any
            # secrets still appear here).
            REDACT='s/(token[[:space:]]*=[[:space:]]*).+/\1***REDACTED***/I'
            docker exec --user root \
              -e "REDACT=${REDACT}" "${CID}" sh -c '
              for f in \
                /var/gerrit/.config/gerrit_to_platform/gerrit_to_platform.ini \
                /var/gerrit/.config/gerrit_to_platform/replication.config; do
                if [ -r "$f" ]; then
                  echo "=== $f ==="
                  sed -E "$REDACT" "$f"
                  echo
                fi
              done' > "${DEST}/g2p-config.txt" 2>&1

            # Hook scripts present (proves the wrapper is in place).
            docker exec --user root "${CID}" \
              ls -la /var/gerrit/hooks/ \
              > "${DEST}/hooks-listing.txt" 2>&1

            # Last 500 lines of the container's own stdout/stderr
            # (for early-boot Gerrit-side issues).
            docker logs --tail 500 "${CID}" \
              > "${DEST}/docker-logs.txt" 2>&1
          done

          # Count diagnostic files collected from containers (the
          # per-container subdirectories live under g2p-diagnostics/
          # so -mindepth 2 skips any future top-level helper files).
          COLLECTED=$(find g2p-diagnostics -mindepth 2 -type f 2>/dev/null \
            | wc -l | tr -d ' ')
          echo "diagnostic files collected: ${COLLECTED}"

          if [ "${COLLECTED}" -eq 0 ]; then
            echo "::warning title=g2p diagnostics::no files collected"
            # Reset the staging directory and signal failure to the
            # upload step via files_collected=false.  The upload
            # step is gated on that output, so it skips entirely
            # rather than relying on upload-artifact's
            # 'if-no-files-found: warn' guard (which would never
            # fire here because the step never runs).
            rm -rf g2p-diagnostics
            mkdir -p g2p-diagnostics
            echo "files_collected=false" >> "$GITHUB_OUTPUT"
            echo "redaction_ok=skipped"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ----------------------------------------------------------
          # POST-CAPTURE SECRET REDACTION
          # ----------------------------------------------------------
          # Workflow logs are auto-masked by GitHub; artefact files
          # are NOT.  The gerrit_to_platform RedactingFilter only
          # scrubs records the framework itself writes — the
          # wrapper's g2p-hooks.log, the container's docker-logs and
          # any stderr emitted before the framework loaded all reach
          # us untouched.  Apply the same patterns here as a defence
          # in depth before the upload step publishes the directory.
          #
          # Patterns kept in lock-step with
          # gerrit_to_platform/_logging.py::RedactingFilter:
          #   * gh[posr]_<20+ alnum>   GitHub token shapes
          #   * Authorization: Bearer|token <value>
          #   * ?token=, ?access_token=, ?api_key= query strings
          #   * token=/secret=/password= labelled values
          #
          # Failure-atomic: any non-zero status from sed or xargs
          # nukes g2p-diagnostics/ and the upload step is skipped.
          # We never publish unredacted content.
          echo "Applying secret-redaction pass to captured artefacts"
          # Patterns kept short and stored in variables so the sed
          # invocation stays under yamllint's 80-col limit.
          PAT_GHTOKEN='s/gh[posr]_[A-Za-z0-9]{20,}/***REDACTED***/g'
          PAT_AUTH_HDR='s/(Authorization[[:space:]]*[:=]'
          PAT_AUTH_HDR="${PAT_AUTH_HDR}"'[[:space:]]*)(Bearer|token)'
          PAT_AUTH_HDR="${PAT_AUTH_HDR}"'[[:space:]]+[^[:space:]]+'
          PAT_AUTH_HDR="${PAT_AUTH_HDR}"'/\1\2 ***REDACTED***/Ig'
          PAT_QS='s/([?&](token|access_token|api_key)='
          PAT_QS="${PAT_QS}"')[^&[:space:]"]+/\1***REDACTED***/Ig'
          PAT_LBL='s/((token|secret|password)[[:space:]]*[:=]'
          PAT_LBL="${PAT_LBL}"'[[:space:]]*)["'\'']?[A-Za-z0-9_\-]{16,}'
          PAT_LBL="${PAT_LBL}"'["'\'']?/\1***REDACTED***/Ig'
          # The redaction pipeline runs inside a subshell with
          # 'set -eo pipefail' so that a non-zero status from
          # 'find', 'xargs' or 'sed' — anywhere in the pipe —
          # surfaces as the subshell's own exit code.  We then
          # capture that code into REDACT_RC and branch on it
          # explicitly (the outer step deliberately runs under
          # 'set +e' so other diagnostic commands cannot mask the
          # workflow result; the subshell + explicit-check pattern
          # is what makes the redaction failure-atomic).
          (
            set -eo pipefail
            # 'find ... -print0 | xargs -0' is portable and handles
            # any unusual filenames safely.
            find g2p-diagnostics -type f \
              \( -name '*.log' -o -name '*.txt' -o -name 'error_log' \
                 -o -name 'sshd_log' -o -name 'replication_log' \) \
              -print0 \
            | xargs -0 -r sed -i -E \
                -e "${PAT_GHTOKEN}" \
                -e "${PAT_AUTH_HDR}" \
                -e "${PAT_QS}" \
                -e "${PAT_LBL}"
          )
          REDACT_RC=$?
          if [ "${REDACT_RC}" -ne 0 ]; then
            echo "::error title=g2p diagnostics::redaction pass failed" \
              "(exit ${REDACT_RC}); discarding diagnostics to avoid" \
              "publishing unredacted secrets"
            rm -rf g2p-diagnostics
            mkdir -p g2p-diagnostics
            echo "files_collected=false" >> "$GITHUB_OUTPUT"
            echo "redaction_ok=false"    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Summary file at the artefact root — written ONLY after a
          # successful redaction so the upload step's
          # 'if-no-files-found' guard remains meaningful.
          {
            echo "# g2p diagnostics summary"
            echo "server_slug: ${SERVER_SLUG}"
            echo "captured_at: $(date -u +%FT%TZ)"
            echo "container_ids: ${CONTAINER_IDS}"
            echo "files_collected: ${COLLECTED}"
            echo "redaction_pass: ok"
            echo
            echo "Per-container files:"
            find g2p-diagnostics -mindepth 2 -type f | sort
          } > g2p-diagnostics/SUMMARY.txt

          echo "files_collected=true"  >> "$GITHUB_OUTPUT"
          echo "redaction_ok=true"     >> "$GITHUB_OUTPUT"
          echo "Diagnostics capture complete."
          ls -la g2p-diagnostics/

      - name: "Upload g2p diagnostics"
        # Gate on the capture step's positive signal so the upload
        # never runs when redaction failed (or no files were
        # collected).  The 'if-no-files-found: warn' guard then only
        # fires for the genuine "capture succeeded but produced
        # zero files" race rather than every opt-out run.
        if: >-
          always() &&
          inputs.configure_g2p == true &&
          steps.gerrit.outputs.container_ids != '' &&
          steps.capture-g2p.outputs.files_collected == 'true' &&
          steps.capture-g2p.outputs.redaction_ok == 'true'
        # actions/upload-artifact v7.0.1 (commit pin per project policy)
        # No additional 'permissions:' scope required: v4+ uploads use
        # ACTIONS_RUNTIME_TOKEN, which is independent of GITHUB_TOKEN.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g2p-diagnostics-${{ matrix.server.slug }}
          path: g2p-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: "Cleanup"
        if: always()
        env:
          CONTAINER_IDS: ${{ steps.gerrit.outputs.container_ids }}
          REMOTE_ACCESS: ${{ inputs.remote_access }}
        run: |
          # Cleanup tunnels and containers
          echo "Cleaning up..."

          if [ "$REMOTE_ACCESS" = "Bore" ]; then
            pkill -f "bore local" 2>/dev/null || true
          fi
          # Note: Tailscale cleanup is handled by its action's post step

          if [ -n "$CONTAINER_IDS" ]; then
            echo "$CONTAINER_IDS" | jq -r '.[]' 2>/dev/null | \
              while IFS= read -r cid; do
                [ -z "$cid" ] && continue
                echo "Stopping container: $cid"
                docker kill "$cid" 2>/dev/null || true
                echo "Removing container: $cid"
                docker rm "$cid" 2>/dev/null || true
              done
          fi

          echo "Cleanup complete ✅"

  ### Resync GitHub Organizations with Gerrit Content ###
  resync-orgs-prepare:
    name: "Prepare resync matrix"
    runs-on: ubuntu-latest
    if: ${{ inputs.reset_orgs == true || inputs.sync_orgs == true }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Build resync matrix from GERRIT_SERVERS"
        id: build-matrix
        env:
          GERRIT_SERVERS: ${{ vars.GERRIT_SERVERS }}
          RESYNC_PROJECT_SLUGS: ${{ inputs.sync_project_slugs }}
        run: |
          # Build matrix with all github orgs (github_org and github_gerrit_org)
          # Each entry maps a GitHub org to its source Gerrit server
          if [ -z "$GERRIT_SERVERS" ]; then
            echo "::error::GERRIT_SERVERS variable is not set"
            exit 1
          fi

          # Validate JSON
          if ! echo "$GERRIT_SERVERS" | jq empty 2>/dev/null; then
            echo "::error::GERRIT_SERVERS is not valid JSON"
            exit 1
          fi

          # Build full matrix: for each server, create entries for both
          # github_org and github_gerrit_org
          # include_projects/exclude_projects are optional fields in
          # GERRIT_SERVERS; when absent they default to empty string.
          # These are passed through to gerrit-clone mirror as
          # --include-projects / --exclude-projects CLI arguments.
          FULL_MATRIX=$(echo "$GERRIT_SERVERS" | jq -c '
            [.[] |
              {
                github_org: .github_org,
                gerrit: .gerrit,
                api_path: .api_path,
                name: .name,
                slug: .slug,
                include_projects: (.include_projects // ""),
                exclude_projects: (.exclude_projects // "")
              },
              {
                github_org: .github_gerrit_org,
                gerrit: .gerrit,
                api_path: .api_path,
                name: .name,
                slug: .slug,
                include_projects: (.include_projects // ""),
                exclude_projects: (.exclude_projects // "")
              }
            ]
          ')

          FULL_COUNT=$(echo "$FULL_MATRIX" | jq '. | length')
          echo "Full matrix has $FULL_COUNT GitHub organizations"

          # Apply resync_project_slugs filter
          if [ -z "$RESYNC_PROJECT_SLUGS" ] || \
             [ "$RESYNC_PROJECT_SLUGS" = "all" ]; then
            # Empty selector or "all" = all orgs
            MATRIX="$FULL_MATRIX"
            echo "Using all $FULL_COUNT GitHub organizations (no selector)"
          else
            # Parse comma/space-separated selectors and support wildcards
            # Convert to newline-separated, trim whitespace
            SELECTORS=$(echo "$RESYNC_PROJECT_SLUGS" \
              | tr ',' '\n' | tr ' ' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -v '^$')

            echo "GitHub org selectors to match:"
            echo "$SELECTORS"

            # Build jq filter for each selector (wildcards supported)
            # Convert shell wildcards to regex: * -> .*, ? -> .
            MATRIX=$(echo "$FULL_MATRIX" | jq -c --arg selectors "$SELECTORS" '
              ($selectors | split("\n")) as $sels |
              [.[] | . as $org |
                select(
                  any($sels[]; . as $sel |
                    if ($sel | contains("*")) or ($sel | contains("?")) then
                      # Convert glob to regex: * -> .*, ? -> .
                      ($sel | gsub("\\*"; ".*") | gsub("\\?"; ".")) as $regex |
                      ($org.github_org | test("^" + $regex + "$"))
                    else
                      $org.github_org == $sel
                    end
                  )
                )
              ]
            ')
            MATCH_COUNT=$(echo "$MATRIX" | jq '. | length')
            if [ "$MATCH_COUNT" -eq 0 ]; then
              echo "::error::No GitHub orgs matched" \
                "selector: $RESYNC_PROJECT_SLUGS"
              echo "Available GitHub organizations:"
              echo "$FULL_MATRIX" | jq -r '.[].github_org'
              exit 1
            fi
            echo "Matched $MATCH_COUNT orgs (selector: $RESYNC_PROJECT_SLUGS)"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$MATRIX" | jq '. | length')
          echo "Resync matrix prepared with $COUNT GitHub organizations"
          echo "$MATRIX" | jq '.'

  reset-orgs:
    name: "Reset: ${{ matrix.org.github_org }}"
    runs-on: ubuntu-latest
    needs: [validate, resync-orgs-prepare]
    if: ${{ inputs.reset_orgs == true }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        org: ${{ fromJSON(needs.resync-orgs-prepare.outputs.matrix) }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: false
          # No checkout step in this job; suppress the empty workdir warning
          ignore-empty-workdir: true

      - name: "Install gerrit-clone CLI"
        env:
          CLONE_REF: ${{ inputs.gerrit_clone_ref }}
        run: |
          if [ -n "$CLONE_REF" ]; then
            REPO="${CLONE_REF%%@*}"
            BRANCH="${CLONE_REF#*@}"
            echo "Installing from source: $REPO @ $BRANCH"
            SRC="gerrit-clone @ "
            SRC+="git+https://github.com/"
            SRC+="${REPO}.git@${BRANCH}"
            uv tool install "$SRC"
          else
            echo "Installing gerrit-clone from PyPI"
            uv tool install gerrit-clone
          fi
          gerrit-clone --version

      - name: "Reset GitHub org: ${{ matrix.org.github_org }}"
        env:
          ORG_TOKEN_JSON: ${{ secrets.ORG_TOKEN_JSON }}
          GITHUB_ORG: ${{ matrix.org.github_org }}
          VERBOSE_DEBUG: ${{ needs.validate.outputs.effective_debug }}
        run: |
          # Resolve this org's admin token from the single
          # base64-encoded JSON secret ORG_TOKEN_JSON. The secret is
          # base64-encoded because raw JSON triggers GitHub's console
          # secret redaction in ways that distort job output; encoding
          # also stops the individual PATs being partially masked.
          # Expected decoded shape:
          #   [{"github_org": "org-name", "token": "github_pat_..."}]
          if [ -z "$ORG_TOKEN_JSON" ]; then
            echo "::error::ORG_TOKEN_JSON secret is not set or empty"
            exit 1
          fi
          ORG_TOKEN_MAP=$(printf '%s' "$ORG_TOKEN_JSON" \
            | base64 -d 2>/dev/null) || {
            echo "::error::Failed to base64-decode ORG_TOKEN_JSON"
            exit 1
          }
          if ! printf '%s' "$ORG_TOKEN_MAP" | jq empty 2>/dev/null; then
            echo "::error::ORG_TOKEN_JSON is not valid JSON once decoded"
            exit 1
          fi
          ORG_TOKEN=$(printf '%s' "$ORG_TOKEN_MAP" \
            | jq -r --arg org "$GITHUB_ORG" \
              'map(select(.github_org == $org)) | .[0].token // empty')
          if [ -z "$ORG_TOKEN" ]; then
            echo "::error::No token for org '$GITHUB_ORG' in ORG_TOKEN_JSON"
            exit 1
          fi
          # Mask the decoded token: GitHub only auto-masks the exact
          # secret value (the base64 blob), not the per-org PAT.
          echo "::add-mask::$ORG_TOKEN"
          echo "Resolved admin token for $GITHUB_ORG (${#ORG_TOKEN} chars)"

          # Reset (delete all repos from) the GitHub org
          echo "Resetting GitHub org: $GITHUB_ORG"
          VERBOSE_ARGS=()
          if [ "$VERBOSE_DEBUG" = "true" ]; then
            VERBOSE_ARGS+=(--verbose)
          fi
          gerrit-clone reset \
            --org "$GITHUB_ORG" \
            --github-token "$ORG_TOKEN" \
            --no-confirm \
            "${VERBOSE_ARGS[@]}"

      - name: "Report reset results"
        if: always()
        env:
          GITHUB_ORG: ${{ matrix.org.github_org }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Reset: $GITHUB_ORG"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| GitHub Org | \`$GITHUB_ORG\` |"
            echo "| Status | ${JOB_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-orgs:
    name: "Sync: ${{ matrix.org.github_org }}"
    runs-on: ubuntu-latest
    needs: [validate, resync-orgs-prepare, reset-orgs]
    # Run when sync is requested, even if reset-orgs was skipped
    if: >-
      ${{ always()
          && inputs.sync_orgs == true
          && needs.validate.result == 'success'
          && needs.resync-orgs-prepare.result == 'success'
          && (needs.reset-orgs.result == 'success'
              || needs.reset-orgs.result == 'skipped') }}
    permissions:
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        org: ${{ fromJSON(needs.resync-orgs-prepare.outputs.matrix) }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: false
          # No checkout step in this job; suppress the empty workdir warning
          ignore-empty-workdir: true

      - name: "Install gerrit-clone CLI"
        env:
          CLONE_REF: ${{ inputs.gerrit_clone_ref }}
        run: |
          if [ -n "$CLONE_REF" ]; then
            REPO="${CLONE_REF%%@*}"
            BRANCH="${CLONE_REF#*@}"
            echo "Installing from source: $REPO @ $BRANCH"
            SRC="gerrit-clone @ "
            SRC+="git+https://github.com/"
            SRC+="${REPO}.git@${BRANCH}"
            uv tool install "$SRC"
          else
            echo "Installing gerrit-clone from PyPI"
            uv tool install gerrit-clone
          fi
          gerrit-clone --version

      - name: "Mirror Gerrit to GitHub: ${{ matrix.org.github_org }}"
        id: mirror
        env:
          ORG_TOKEN_JSON: ${{ secrets.ORG_TOKEN_JSON }}
          GITHUB_ORG: ${{ matrix.org.github_org }}
          GERRIT_SERVER: ${{ matrix.org.gerrit }}
          MIRROR_OUTPUT_PATH: "/tmp/mirror-${{ matrix.org.github_org }}"
          VERBOSE_DEBUG: ${{ needs.validate.outputs.effective_debug }}
          # Project filtering (optional, from GERRIT_SERVERS variable)
          INCLUDE_PROJECTS: ${{ matrix.org.include_projects }}
          EXCLUDE_PROJECTS: ${{ matrix.org.exclude_projects }}
          REMOVE_FILES: ${{ inputs.remove_files }}
          GIT_FILTER_PROJECTS: ${{ inputs.git_filter_projects }}
          GIT_FILTER_TOKENS: ${{ secrets.GIT_FILTER_TOKENS }}
        run: |
          # Resolve this org's admin token from the single
          # base64-encoded JSON secret ORG_TOKEN_JSON. The secret is
          # base64-encoded because raw JSON triggers GitHub's console
          # secret redaction in ways that distort job output; encoding
          # also stops the individual PATs being partially masked.
          # Expected decoded shape:
          #   [{"github_org": "org-name", "token": "github_pat_..."}]
          if [ -z "$ORG_TOKEN_JSON" ]; then
            echo "::error::ORG_TOKEN_JSON secret is not set or empty"
            exit 1
          fi
          ORG_TOKEN_MAP=$(printf '%s' "$ORG_TOKEN_JSON" \
            | base64 -d 2>/dev/null) || {
            echo "::error::Failed to base64-decode ORG_TOKEN_JSON"
            exit 1
          }
          if ! printf '%s' "$ORG_TOKEN_MAP" | jq empty 2>/dev/null; then
            echo "::error::ORG_TOKEN_JSON is not valid JSON once decoded"
            exit 1
          fi
          ORG_TOKEN=$(printf '%s' "$ORG_TOKEN_MAP" \
            | jq -r --arg org "$GITHUB_ORG" \
              'map(select(.github_org == $org)) | .[0].token // empty')
          if [ -z "$ORG_TOKEN" ]; then
            echo "::error::No token for org '$GITHUB_ORG' in ORG_TOKEN_JSON"
            exit 1
          fi
          # Mask the decoded token: GitHub only auto-masks the exact
          # secret value (the base64 blob), not the per-org PAT.
          echo "::add-mask::$ORG_TOKEN"
          echo "Resolved admin token for $GITHUB_ORG (${#ORG_TOKEN} chars)"

          # Mirror all repos from Gerrit to GitHub
          # This is idempotent: missing repos are created, existing
          # repos are pushed to (git push --mirror is a safe no-op
          # when the repo is already up to date).
          echo "Mirroring $GERRIT_SERVER -> $GITHUB_ORG"

          # Build project filtering arguments from matrix values
          # These come from include_projects/exclude_projects fields
          # in the GERRIT_SERVERS repository variable and support
          # comma or space-separated lists of Gerrit project names
          # with shell-style wildcards (*, ?, [seq])
          FILTER_ARGS=()

          if [ -n "$INCLUDE_PROJECTS" ]; then
            # Split on commas and spaces, pass each as a separate arg
            read -ra INCLUDES \
              <<< "$(printf '%s' "$INCLUDE_PROJECTS" | tr ',' ' ')"
            for project in "${INCLUDES[@]}"; do
              project=$(echo "$project" | xargs)  # trim whitespace
              if [ -n "$project" ]; then
                FILTER_ARGS+=(--include-projects "$project")
              fi
            done

          fi

          if [ -n "$EXCLUDE_PROJECTS" ]; then
            # Split on commas and spaces, pass each as a separate arg
            read -ra EXCLUDES \
              <<< "$(printf '%s' "$EXCLUDE_PROJECTS" | tr ',' ' ')"
            for project in "${EXCLUDES[@]}"; do
              project=$(echo "$project" | xargs)  # trim whitespace
              if [ -n "$project" ]; then
                FILTER_ARGS+=(--exclude-projects "$project")
              fi
            done
          fi

          # Content filtering: remove file patterns
          if [ -n "$REMOVE_FILES" ]; then
            FILTER_ARGS+=(--remove-files "$REMOVE_FILES")
          fi

          # Content filtering: git history token replacement
          # GIT_FILTER_PROJECTS holds project patterns (from input)
          # GIT_FILTER_TOKENS holds the actual secrets (from repo secret)
          # Format expected by --git-filter:
          #   'project:token1,token2;project2:token3'
          # Assemble the spec by pairing each project with the token(s)
          if [ -n "$GIT_FILTER_PROJECTS" ] && [ -n "$GIT_FILTER_TOKENS" ]; then
            GIT_FILTER_SPEC=""
            IFS=';' read -ra PROJECTS <<< "$GIT_FILTER_PROJECTS"
            IFS=';' read -ra TOKENS <<< "$GIT_FILTER_TOKENS"
            for i in "${!PROJECTS[@]}"; do
              proj=$(echo "${PROJECTS[$i]}" | xargs)
              # Use matching token or last available token
              if [ "$i" -lt "${#TOKENS[@]}" ]; then
                tok=$(echo "${TOKENS[$i]}" | xargs)
              else
                tok=$(echo "${TOKENS[-1]}" | xargs)
              fi
              if [ -n "$proj" ] && [ -n "$tok" ]; then
                if [ -n "$GIT_FILTER_SPEC" ]; then
                  GIT_FILTER_SPEC+=";${proj}:${tok}"
                else
                  GIT_FILTER_SPEC="${proj}:${tok}"
                fi
              fi
            done
            if [ -n "$GIT_FILTER_SPEC" ]; then
              FILTER_ARGS+=(--git-filter "$GIT_FILTER_SPEC")
            fi
          fi

          # Capture exit code so manifest parsing runs even on
          # partial failure (exit code 7 = some clones failed)
          MIRROR_RC=0
          VERBOSE_ARGS=()
          if [ "$VERBOSE_DEBUG" = "true" ]; then
            VERBOSE_ARGS+=(--verbose)
          fi
          gerrit-clone mirror \
            --server "$GERRIT_SERVER" \
            --org "$GITHUB_ORG" \
            --github-token "$ORG_TOKEN" \
            --output-path "$MIRROR_OUTPUT_PATH" \
            --overwrite \
            --no-mirror \
            --discovery-method http \
            --https \
            "${VERBOSE_ARGS[@]}" \
            "${FILTER_ARGS[@]}" || MIRROR_RC=$?

          # Extract counts from manifest for downstream reporting
          MANIFEST="$MIRROR_OUTPUT_PATH/mirror-manifest.json"
          if [ -f "$MANIFEST" ]; then
            SUCCESS_COUNT=$(jq -r '.succeeded // 0' "$MANIFEST")
            FAILURE_COUNT=$(jq -r '.failed // 0' "$MANIFEST")
            TOTAL_COUNT=$(jq -r '.total // 0' "$MANIFEST")
          else
            echo "::warning::Mirror manifest not found at $MANIFEST"
            SUCCESS_COUNT=0
            FAILURE_COUNT=0
            TOTAL_COUNT=0
          fi

          {
            echo "success-count=$SUCCESS_COUNT"
            echo "failure-count=$FAILURE_COUNT"
            echo "total-count=$TOTAL_COUNT"
          } >> "$GITHUB_OUTPUT"

          # Re-exit with the original code so the step still
          # reports failure when there were clone errors
          exit "$MIRROR_RC"

      - name: "Report sync results"
        if: always()
        env:
          GITHUB_ORG: ${{ matrix.org.github_org }}
          GERRIT_SERVER: ${{ matrix.org.gerrit }}
          SUCCESS_COUNT: ${{ steps.mirror.outputs.success-count }}
          FAILURE_COUNT: ${{ steps.mirror.outputs.failure-count }}
          TOTAL_COUNT: ${{ steps.mirror.outputs.total-count }}
          INCLUDE_PROJECTS: ${{ matrix.org.include_projects }}
          EXCLUDE_PROJECTS: ${{ matrix.org.exclude_projects }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Sync: $GITHUB_ORG"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| GitHub Org | \`$GITHUB_ORG\` |"
            echo "| Gerrit Server | \`$GERRIT_SERVER\` |"
            echo "| Status | ${JOB_STATUS} |"
            echo "| Total | $TOTAL_COUNT |"
            echo "| Succeeded | $SUCCESS_COUNT |"
            echo "| Failed | $FAILURE_COUNT |"
            if [ -n "$INCLUDE_PROJECTS" ]; then
              echo "| Include Filter | \`$INCLUDE_PROJECTS\` |"
            fi
            if [ -n "$EXCLUDE_PROJECTS" ]; then
              echo "| Exclude Filter | \`$EXCLUDE_PROJECTS\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  ### Summary job ###
  summary:
    name: "Test Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - validate
      - prepare
      - deploy-gerrit
      - reset-orgs
      - sync-orgs
    if: always()
    permissions:
      contents: read
    steps:
      - name: "Generate summary"
        env:
          PERSIST_MINUTES: ${{ needs.validate.outputs.persist_minutes }}
          DEBUG_COUNT: ${{ needs.prepare.outputs.debug_count }}
          RESET_ORGS: ${{ inputs.reset_orgs }}
          SYNC_ORGS: ${{ inputs.sync_orgs }}
          CONFIGURE_G2P: ${{ inputs.configure_g2p }}
          NEEDS_VALIDATE_RESULT: ${{ needs.validate.result }}
          NEEDS_PREPARE_RESULT: ${{ needs.prepare.result }}
          NEEDS_DEPLOY_GERRIT_RESULT: ${{ needs.deploy-gerrit.result }}
          NEEDS_RESET_ORGS_RESULT: ${{ needs.reset-orgs.result }}
          NEEDS_SYNC_ORGS_RESULT: ${{ needs.sync-orgs.result }}
        run: |
          # Generate test summary
          {
            echo "# Gerrit Server Test Results 📊"
            echo ""
            echo "| Status | Details |"
            echo "|--------|---------|"
            echo "| Validation | ${NEEDS_VALIDATE_RESULT} |"
            echo "| Preparation | ${NEEDS_PREPARE_RESULT} |"
            if [ "$PERSIST_MINUTES" != "0" ] && \
               [ "$DEBUG_COUNT" != "0" ]; then
              echo "| Deploy Gerrit ($DEBUG_COUNT) \
                | ${NEEDS_DEPLOY_GERRIT_RESULT} |"
            elif [ "$DEBUG_COUNT" = "0" ]; then
              echo "| Deploy Gerrit | skipped (selector: none) |"
            fi
            if [ "$RESET_ORGS" = "true" ]; then
              echo "| Reset Orgs \
                | ${NEEDS_RESET_ORGS_RESULT} |"
            fi
            if [ "$SYNC_ORGS" = "true" ]; then
              echo "| Sync Orgs \
                | ${NEEDS_SYNC_ORGS_RESULT} |"
            fi
            if [ "$CONFIGURE_G2P" = "true" ]; then
              # Reflect the actual deploy-gerrit job outcome
              # (which is where G2P configuration runs) rather
              # than the bare "enabled" flag.  If the deploy job
              # failed or was cancelled, G2P did not succeed.
              DEPLOY_RESULT="${NEEDS_DEPLOY_GERRIT_RESULT}"
              case "$DEPLOY_RESULT" in
                success)
                  G2P_STATUS="✅ succeeded"
                  ;;
                failure)
                  G2P_STATUS="❌ failed"
                  ;;
                cancelled)
                  G2P_STATUS="⚠️ cancelled"
                  ;;
                skipped)
                  G2P_STATUS="skipped"
                  ;;
                *)
                  G2P_STATUS="$DEPLOY_RESULT"
                  ;;
              esac
              echo "| G2P Integration | $G2P_STATUS |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Check overall result"
        if: >-
          needs.deploy-gerrit.result == 'failure'
          || needs.reset-orgs.result == 'failure'
          || needs.sync-orgs.result == 'failure'
        run: |
          echo "::error::One or more jobs failed"
          exit 1
