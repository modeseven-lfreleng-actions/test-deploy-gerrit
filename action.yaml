# actions-template
name: "🛠️ Actions Template"
description: "Description of action"
# Any relevant notes/observations can go here

inputs:
  input:
    description: "Description of input"
    required: true

outputs:
  output:
    description: "Description of output"
    value: ${{ steps.code.outputs.output }}

runs:
  using: "composite"
  steps:
    - name: "Friendly Name"
      id: code
      shell: bash
      env:
        INPUT_INPUT: ${{ inputs.input }}
      run: |
        # Friendly Name
        input="$INPUT_INPUT"
        if [ -z "$input" ]; then
          echo "Error: mandatory input was not set/configured ❌"
          exit 1
        fi

        # Emit the output via a heredoc delimiter so an input value
        # containing newlines cannot forge additional outputs. The
        # delimiter is built from shell-builtin randomness (no external
        # tools such as openssl/uuidgen, which are not guaranteed on
        # self-hosted runners) and regenerated until it is provably
        # absent from the value being emitted.
        delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        while [[ "$input" == *"$delimiter"* ]]; do
          delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        done
        {
          printf '%s<<%s\n' 'output' "$delimiter"
          printf '%s\n' "$input"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"
        echo "Action received: $input ✅"
        echo "Action received: $input ✅" >> "$GITHUB_STEP_SUMMARY"
